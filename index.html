<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AuthentiPay AI - Ultimate Edition</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
:root { --primary: #0ea5e9; --dark: #0f172a; --bg: #f8fafc; }
body { margin:0; font-family:'Inter', sans-serif; background: var(--dark); display:flex; justify-content:center; align-items:flex-start; min-height:100vh; padding: 10px; color: #fff; }
.container { width:100%; max-width:450px; background:#fff; border-radius:30px; padding:20px; color: #1e293b; box-shadow:0 30px 60px rgba(0,0,0,0.5); margin-top: 10px; position: relative; }

/* FULL RESOLUTION VIEWPORT */
.scanner-container { position: relative; width: 100%; border-radius: 20px; overflow: hidden; background: #000; margin-top: 15px; border: 2px solid var(--primary); min-height: 350px; max-height: 75vh; display: none; }
video, #preview { width: 100%; height: auto; max-height: 75vh; object-fit: contain; display: block; margin: auto; }

.scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--primary); box-shadow: 0 0 20px var(--primary); animation: full-scan 2.5s infinite linear; z-index: 10; display: none; }
@keyframes full-scan { 0% { top: 0%; } 100% { top: 100%; } }

/* LANGUAGE BOX & UI */
.top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.lang-box { background: #f1f5f9; padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 11px; border: 1px solid #e2e8f0; }
select { border:none; background:none; font-weight:800; color:var(--primary); cursor:pointer; outline:none; }

.btn { width: 100%; padding: 16px; border-radius: 18px; border: none; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3); }
.btn-secondary { background: #f1f5f9; color: var(--dark); border: 1px solid #e2e8f0; }

.dashboard { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 20px; padding: 15px; margin-top: 15px; }
.rev-val { font-size: 26px; font-weight: 900; color: var(--dark); }

/* RESULT PANEL */
#detailsPanel { margin-top: 15px; background: #fff; border: 2px dashed var(--primary); border-radius: 20px; padding: 15px; display: none; }
.row { display: flex; justify-content: space-between; font-size: 12px; margin: 5px 0; font-weight: 700; color: #64748b; border-bottom: 1px solid #f1f5f9; padding-bottom: 5px; }
.row span { color: var(--dark); font-weight: 900; text-align: right; }

#pop { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; place-items: center; z-index: 1000; backdrop-filter: blur(10px); }
.pop-card { background: #fff; padding: 35px; border-radius: 35px; width: 80%; text-align: center; }
</style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <div class="lang-box">
      AI VOICE: <select id="vLang"><option value="hi-IN">HINDI</option><option value="en-US">ENGLISH</option></select>
    </div>
    <button id="sBtn" style="border:none; background:none; font-size:20px; cursor:pointer;" onclick="tglSnd()">🔊</button>
  </div>

  <h2 style="margin:0; font-size: 26px; font-weight: 900; color:var(--dark);">AuthentiPay <span style="color:var(--primary);">AI</span></h2>
  <p style="font-size: 10px; color: #94a3b8; font-weight: 800; text-transform: uppercase;">Full Scale Smart Scanner</p>

  <div id="initBtns">
    <button class="btn btn-primary" onclick="initCam()">LIVE CAMERA SCAN</button>
    <button class="btn btn-secondary" onclick="document.getElementById('fIn').click()">UPLOAD FULL SCREENSHOT</button>
  </div>
  <input type="file" id="fIn" hidden accept="image/*">

  <div class="scanner-container" id="sBox">
    <div class="scan-line" id="sLine"></div>
    <video id="v" autoplay playsinline></video>
    <img id="p" style="display:none">
  </div>
  <button id="capBtn" class="btn btn-primary" style="display:none">VALIDATE & EXTRACT</button>

  <div class="dashboard">
    <div style="font-size: 10px; color: #94a3b8; font-weight: 800; letter-spacing: 1px;">TOTAL BUSINESS REVENUE</div>
    <div id="rev" class="rev-val">₹0.00</div>
  </div>

  <div id="detailsPanel">
    <div class="row">Customer/Party: <span id="rName">-</span></div>
    <div class="row">Amount Detected: <span id="rAmt">-</span></div>
    <div class="row">Transaction ID: <span id="rID">-</span></div>
  </div>
</div>

<div id="pop">
  <div class="pop-card">
    <div id="pIcon" style="font-size:60px;"></div>
    <h2 id="pTitle" style="font-weight:900; margin:15px 0; color:var(--dark);"></h2>
    <button class="btn btn-primary" onclick="location.reload()">NEXT SCAN</button>
  </div>
</div>

<canvas id="c" hidden></canvas>

<script>
let state = JSON.parse(localStorage.getItem('ap_ultra_v5')) || { rev: 0 };
let snd = true;
let strm = null;

const tglSnd = () => { snd = !snd; sBtn.innerText = snd ? "🔊" : "🔈"; };
const speak = (m) => { 
  if(snd) { 
    window.speechSynthesis.cancel(); 
    const u = new SpeechSynthesisUtterance(m); 
    u.lang = vLang.value; 
    u.rate = 0.9; 
    window.speechSynthesis.speak(u); 
  } 
};

rev.innerText = `₹${state.rev.toLocaleString('en-IN')}`;

async function initCam() {
  try {
    strm = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
    v.srcObject = strm;
    sBox.style.display = "block";
    initBtns.style.display = "none";
    capBtn.style.display = "block";
    sLine.style.display = "block";
  } catch(e) { alert("Camera Error"); }
}

capBtn.onclick = () => {
  const ctx = c.getContext('2d');
  c.width = v.videoWidth; 
  c.height = v.videoHeight;
  // SMART CROP + FILTERS
  ctx.filter = "contrast(1.5) grayscale(1)";
  ctx.drawImage(v, 0, 0, c.width, c.height);
  
  const img = c.toDataURL('image/jpeg', 0.9);
  v.style.display = "none"; p.src = img; p.style.display = "block";
  capBtn.style.display = "none";
  if(strm) strm.getTracks().forEach(t => t.stop());
  doOCR(img);
};

fIn.onchange = (e) => {
  const r = new FileReader();
  r.onload = (ex) => { 
    sBox.style.display="block"; v.style.display="none"; 
    p.src=ex.target.result; p.style.display="block"; 
    initBtns.style.display="none"; sLine.style.display="block";
    doOCR(ex.target.result); 
  };
  r.readAsDataURL(e.target.files[0]);
};

async function doOCR(src) {
  const wrk = await Tesseract.createWorker();
  await wrk.loadLanguage('eng');
  await wrk.initialize('eng');
  const { data: { text } } = await wrk.recognize(src);
  await wrk.terminate();
  parse(text);
}

function parse(txt) {
  const l = txt.toLowerCase();
  const lang = vLang.value;

  let amt = 0;
  const matches = txt.match(/[\d,]+\.\d{2}/g);
  if(matches) amt = parseFloat(matches.sort((a,b) => b.length - a.length)[0].replace(/,/g,''));

  let name = (txt.match(/(?:To|From|Paid|Name|Received)\s*:?\s*([A-Z\s]{3,20})/i) || [null, "Verified Merchant"])[1].trim();
  let id = (txt.match(/[a-zA-Z0-9.\-_]+@[a-zA-Z0-9.\-_]+/) || txt.match(/\d{12}/) || ["Not Found"])[0];

  const isOk = (l.includes('success') || l.includes('paid') || l.includes('received') || l.includes('completed')) && amt > 0;

  detailsPanel.style.display = "block";
  rName.innerText = name; rAmt.innerText = "₹" + amt; rID.innerText = id;

  if(isOk) {
    state.rev += amt;
    localStorage.setItem('ap_ultra_v5', JSON.stringify(state));
    rev.innerText = `₹${state.rev.toLocaleString('en-IN')}`;
    speak(lang === "hi-IN" ? `${name} se ${amt} rupaye prapt hue` : `Received ${amt} rupees from ${name}`);
  } else {
    speak(lang === "hi-IN" ? "Payment verify nahi hua" : "Verification Failed");
  }

  pop.style.display = "grid";
  pIcon.innerText = isOk ? "✅" : "🛡️";
  pTitle.innerText = isOk ? "Success" : "Alert";
}
</script>
</body>
</html>
