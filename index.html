<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay AI | Neural Integrity</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root { --main: #10b981; --err: #ff4d4d; --dark: #09090b; }
        body { margin: 0; background: var(--dark); color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .panel { width: 420px; background: #18181b; border: 1px solid #27272a; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .brand { border-bottom: 1px solid #27272a; padding-bottom: 15px; margin-bottom: 20px; }
        .brand h2 { margin: 0; color: var(--main); font-size: 20px; }
        .brand p { margin: 0; font-size: 10px; color: #71717a; text-transform: uppercase; }
        
        .screen { width: 100%; height: 320px; background: #000; border-radius: 12px; margin-bottom: 20px; position: relative; overflow: hidden; border: 1px solid #27272a; }
        video, #preview { width: 100%; height: 100%; object-fit: contain; }
        
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 14px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 12px; }
        .btn-l { background: var(--main); color: #000; }
        .btn-u { background: #27272a; color: #fff; }
        
        #result-hud { margin-top: 20px; padding: 15px; border-radius: 12px; background: #000; display: none; border: 1px solid #27272a; border-left: 4px solid var(--main); }
        #verdict { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
        .meta { font-size: 11px; color: #a1a1aa; display: flex; justify-content: space-between; margin-top: 5px; }
        #status-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #3f3f46; font-size: 12px; }
    </style>
</head>
<body>

<div class="panel">
    <div class="brand">
        <h2>SafePay AI</h2>
        <p>B.Tech AIML | Unitedworld Institute of Technology</p>
    </div>

    <div class="screen">
        <video id="v" autoplay playsinline style="display:none;"></video>
        <img id="p" style="display:none;">
        <div id="status-msg">INITIALIZING NEURAL CORE...</div>
    </div>

    <div class="btn-row">
        <button class="btn btn-l" onclick="startCam()">LIVE SCAN</button>
        <button class="btn btn-u" onclick="document.getElementById('f').click()">UPLOAD</button>
        <input type="file" id="f" hidden accept="image/*" onchange="loadFile(event)">
    </div>

    <div id="result-hud">
        <div id="verdict">PROCESSING...</div>
        <div class="meta">Confidence: <span id="m-conf" style="color:white">0%</span></div>
        <div class="meta">Amount: <span id="m-amt" style="color:white">--</span></div>
        <div class="meta">Ref ID: <span id="m-id" style="color:white">--</span></div>
    </div>
</div>

<canvas id="c" style="display:none;"></canvas>

<script>
    const MODEL_PATH = "https://teachablemachine.withgoogle.com/models/i583iDC7K/";
    let ai;

    // Load Model (Self-Executing)
    (async function init() {
        try {
            ai = await tmImage.load(MODEL_PATH + "model.json", MODEL_PATH + "metadata.json");
            document.getElementById('status-msg').innerText = "AI ONLINE";
            document.getElementById('status-msg').style.color = "var(--main)";
        } catch(e) {
            document.getElementById('status-msg').innerText = "CONNECTION ERROR";
        }
    })();

    async function startCam() {
        const video = document.getElementById('v');
        const img = document.getElementById('p');
        video.style.display="block"; img.style.display="none";
        document.getElementById('status-msg').style.display="none";
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
            video.srcObject = stream;
            // Scan every 4 seconds for Live
            setInterval(() => { if(video.srcObject) runAI(video); }, 4000);
        } catch(e) { alert("Camera Permission Required"); }
    }

    function loadFile(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        const img = document.getElementById('p');
        const video = document.getElementById('v');
        img.style.display="block"; video.style.display="none";
        document.getElementById('status-msg').style.display="none";

        reader.onload = (f) => {
            img.src = f.target.result;
            img.onload = () => runAI(img);
        };
        reader.readAsDataURL(file);
    }

    async function runAI(source) {
        if(!ai) return;
        
        // 1. Teachable Machine Prediction
        const predictions = await ai.predict(source);
        const top = predictions.sort((a,b) => b.probability - a.probability)[0];

        // 2. OCR Extraction
        const canvas = document.getElementById('c');
        canvas.width = source.videoWidth || source.naturalWidth;
        canvas.height = source.videoHeight || source.naturalHeight;
        canvas.getContext('2d').drawImage(source, 0, 0);
        
        const ocr = await Tesseract.recognize(canvas, 'eng');
        const text = ocr.data.text.toLowerCase();

        showResult(top, text);
    }

    function showResult(top, text) {
        const hud = document.getElementById('result-hud');
        const v = document.getElementById('verdict');
        hud.style.display = "block";
        
        const isReal = top.className.toLowerCase().includes("real");
        v.innerText = isReal ? "AUTHENTIC" : "FAKE DETECTED";
        v.style.color = isReal ? "var(--main)" : "var(--err)";
        hud.style.borderLeftColor = isReal ? "var(--main)" : "var(--err)";
        
        document.getElementById('m-conf').innerText = (top.probability * 100).toFixed(1) + "%";
        
        // Extraction Logic
        const amt = text.match(/[₹rs]\s?\d+/i);
        const ref = text.match(/\d{10,12}/);
        document.getElementById('m-amt').innerText = amt ? amt[0].toUpperCase() : "N/A";
        document.getElementById('m-id').innerText = ref ? ref[0] : "N/A";

        // Voice
        const talk = new SpeechSynthesisUtterance(isReal ? "Verified" : "Fraud Alert");
        window.speechSynthesis.speak(talk);
    }
</script>
</body>
</html>
