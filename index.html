<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuthentiPay AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js"></script>

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#f1f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:white;
    padding:20px;
    border-radius:20px;
    text-align:center;
}

button{
    padding:12px;
    border:none;
    background:black;
    color:white;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
}

.camera{
    height:260px;
    background:black;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    margin-top:10px;
}

video{width:100%;height:100%;object-fit:cover;}

.box{
    position:absolute;
    border:2px dashed lime;
    width:80%;
    height:60%;
    top:20%;
    left:10%;
}

.result{
    margin-top:10px;
    padding:10px;
    border-radius:10px;
}

.real{background:#dcfce7;color:#166534;}
.fake{background:#fee2e2;color:#991b1b;}

.status{
    font-size:13px;
    margin-top:5px;
    color:gray;
}
</style>
</head>

<body>

<div class="container">
<h2>AuthentiPay AI</h2>

<button onclick="startCamera()">Enable Camera</button>
<div class="status" id="status">Camera not started</div>

<div class="camera">
<video id="video" autoplay playsinline></video>
<div class="box"></div>
</div>

<div id="result" class="result"></div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let model;
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let resultDiv = document.getElementById('result');
let statusText = document.getElementById('status');

let buffer=[];

async function loadModel(){
    statusText.innerText = "Loading AI model...";
    model = await mobilenet.load();
    statusText.innerText = "Click 'Enable Camera'";
}
loadModel();

async function startCamera(){
    try{
        const stream = await navigator.mediaDevices.getUserMedia({video:true});
        video.srcObject = stream;
        statusText.innerText = "Camera active. Show receipt...";
        autoScan();
    }catch(err){
        statusText.innerText = "❌ Camera permission denied!";
    }
}

function autoScan(){
    setInterval(async ()=>{

        if(video.readyState !== 4) return;

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0);

        const predictions = await model.classify(canvas);
        let prob = predictions[0].probability;

        buffer.push(prob);
        if(buffer.length>5) buffer.shift();

        let avg = buffer.reduce((a,b)=>a+b,0)/buffer.length;

        showResult(avg);

    },1500);
}

function showResult(prob){
    let confidence = Math.round(prob*100);

    if(prob>0.6){
        resultDiv.className="result real";
        resultDiv.innerHTML = `
        🟢 VERIFIED<br>
        Trust Score: ${confidence}%
        `;
    }else{
        resultDiv.className="result fake";
        resultDiv.innerHTML = `
        🔴 SUSPICIOUS<br>
        Trust Score: ${confidence}%
        `;
    }
}
</script>

</body>
</html>
