<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay | Final Project</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f1f5f9; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h1 { color: #4F46E5; font-size: 32px; margin-bottom: 10px; letter-spacing: -1px; }
        .camera-box { position: relative; width: 100%; height: 300px; background: #000; border-radius: 20px; overflow: hidden; border: 3px solid #e2e8f0; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scan-line { position: absolute; width: 100%; height: 3px; background: #4F46E5; top: 0; animation: scan 2s infinite linear; display: none; }
        @keyframes scan { 100% { top: 100%; } }
        .btn { background: #4F46E5; color: white; border: none; padding: 18px; border-radius: 15px; font-size: 17px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; transition: 0.3s; }
        #result { margin-top: 20px; padding: 20px; border-radius: 15px; font-weight: bold; display: none; border: 2px solid transparent; }
        .real { background: #dcfce7; color: #166534; border-color: #22c55e; }
        .fake { background: #fee2e2; color: #991b1b; border-color: #ef4444; }
        .loader { color: #4F46E5; font-weight: bold; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>SafePay</h1>
    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <div id="line" class="scan-line"></div>
    </div>
    
    <button id="mainBtn" class="btn" onclick="startScanner()">Initialize Engine</button>
    <div id="loader" class="loader">🧬 AI analyzing patterns...</div>
    <div id="result"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    let model;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const resultDiv = document.getElementById('result');
    const loader = document.getElementById('loader');
    const line = document.getElementById('line');

    async function loadModel() {
        model = await mobilenet.load();
        console.log("Model Loaded");
    }
    loadModel();

    async function startScanner() {
        if (!video.srcObject) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            document.getElementById('mainBtn').innerText = "Scan Receipt";
            return;
        }

        loader.style.display = 'block';
        line.style.display = 'block';
        resultDiv.style.display = 'none';

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // AI prediction
        const predictions = await model.classify(canvas);
        
        // Pixel/Color Logic (Extra layer for accuracy)
        const frameData = ctx.getImageData(canvas.width/2, canvas.height/2, 100, 100).data;
        let hasReceiptColors = false;
        for(let i=0; i<frameData.length; i+=4) {
            if(frameData[i+1] > 100) hasReceiptColors = true; // Checking for Green/Blue hues
        }

        setTimeout(() => {
            loader.style.display = 'none';
            line.style.display = 'none';
            resultDiv.style.display = 'block';

            // Hybrid decision logic
            const top = predictions[0];
            const isDigital = top.className.toLowerCase().includes('screen') || top.className.toLowerCase().includes('monitor') || top.className.toLowerCase().includes('web');
            
            // Final Decision: Agar digital screen hai + receipt colors mil rahe hain
            if ((isDigital && top.probability > 0.4) || (hasReceiptColors && top.probability > 0.6)) {
                resultDiv.innerHTML = "✅ REAL PAYMENT<br><small>Transaction pattern verified.</small>";
                resultDiv.className = "real";
                speak("Verified. Real payment.");
            } else {
                resultDiv.innerHTML = "⚠️ FAKE / INVALID<br><small>Pattern mismatch detected.</small>";
                resultDiv.className = "fake";
                speak("Warning. Fake payment.");
            }
        }, 1500);
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    }
</script>
</body>
</html>
