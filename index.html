<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuthentiPay AI</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#0f172a,#e2e8f0);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container{
  width:420px;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
  text-align:center;
}
h2{margin:0;}
img{width:100%;border-radius:12px;margin-top:10px;}
.result{margin-top:10px;padding:12px;border-radius:10px;font-weight:bold;}
.real{background:#dcfce7;color:#166534;}
.fake{background:#fee2e2;color:#991b1b;}
.info{font-size:13px;color:#64748b;margin-top:5px;}
button,input{margin-top:10px;padding:8px;}
</style>
</head>

<body>

<div class="container">
<h2>AuthentiPay AI</h2>

<input type="file" id="upload" accept="image/*">

<label>
<input type="checkbox" id="soundToggle" checked> Sound ON
</label>

<img id="preview" style="display:none;">

<div id="status" class="info">Upload a receipt</div>
<div id="result" class="result">Waiting...</div>
<div id="details" class="info"></div>

</div>

<script>

let preview=document.getElementById("preview");
let resultDiv=document.getElementById("result");
let statusText=document.getElementById("status");
let details=document.getElementById("details");
let soundOn=true;

document.getElementById("soundToggle").onchange=e=>{
  soundOn=e.target.checked;
};

// upload
document.getElementById("upload").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;

  preview.src=URL.createObjectURL(file);
  preview.style.display="block";

  preview.onload=()=>{
    process(preview);
  };
});

// main OCR
async function process(img){

  statusText.innerText="Scanning...";

  const { data:{ text } } = await Tesseract.recognize(img,'eng');

  analyze(text);
}

// analysis
function analyze(text){

  let t=text.toLowerCase();

  let score=0;

  // rules
  if(/\w+@\w+/.test(t)) score+=2;
  if(/₹\s?\d+/.test(t)) score+=2;
  if(/\d{12,16}/.test(t)) score+=2;
  if(t.includes("success") || t.includes("paid")) score+=2;
  if(t.includes("phonepe")||t.includes("gpay")||t.includes("paytm")||t.includes("bhim")) score+=1;

  let prob=score/9;
  let confidence=Math.round(prob*100);

  let isReal=prob>0.5;

  // extract data
  let amount=(t.match(/₹\s?\d+/)||["Not found"])[0];
  let upi=(t.match(/\w+@\w+/)||["Not found"])[0];
  let risk=prob>0.7?"LOW":prob>0.5?"MEDIUM":"HIGH";

  resultDiv.className="result "+(isReal?"real":"fake");

  resultDiv.innerHTML=`
  ${isReal?"🟢 VERIFIED":"🔴 SUSPICIOUS"}<br>
  Trust Score: ${confidence}%
  `;

  details.innerHTML=`
  Amount: ${amount}<br>
  UPI: ${upi}<br>
  Risk Level: ${risk}
  `;

  statusText.innerText="Done";

  speak(isReal,confidence);
}

// voice
function speak(isReal,conf){

  if(!soundOn) return;

  let msg=isReal
  ? `Payment verified with ${conf} percent confidence`
  : `Suspicious payment detected`;

  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(msg));
}

</script>

</body>
</html>
