<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuthentiPay AI</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
body{
  margin:0; font-family:system-ui;
  background:linear-gradient(135deg,#0f172a,#e2e8f0);
  display:flex; justify-content:center; align-items:center; height:100vh;
  position: relative;
}
.container{
  width:420px; background:white; border-radius:20px; padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.2); text-align:center;
}
#soundToggle {
  position: absolute; top: 20px; right: 20px;
  background: white; border-radius: 50%; width: 45px; height: 45px;
  display: flex; justify-content: center; align-items: center;
  cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  font-size: 20px; border: none; z-index: 10;
}
img{width:100%; border-radius:12px; margin-top:10px;}
.result{margin-top:10px; padding:12px; border-radius:10px; font-weight:bold;}
.real{background:#dcfce7; color:#166534;}
.fake{background:#fee2e2; color:#991b1b;}
.info{font-size:13px; color:#64748b; margin-top:5px; text-align: left; padding: 0 5px;}
button,input{margin-top:10px; padding:8px;}
hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }
</style>
</head>
<body>

<button id="soundToggle">🔊</button>

<div class="container">
  <h2>AuthentiPay AI</h2>
  <input type="file" id="upload" accept="image/*">
  <button id="resetBtn" style="display:none;">Upload New</button>
  <img id="preview" style="display:none;">
  <div id="status" class="info" style="text-align:center;">Upload a receipt</div>
  <div id="result" class="result">Waiting...</div>
  <div id="details" class="info"></div>
</div>

<script>
let preview=document.getElementById("preview");
let resultDiv=document.getElementById("result");
let statusText=document.getElementById("status");
let details=document.getElementById("details");
let resetBtn=document.getElementById("resetBtn");
let soundToggle = document.getElementById("soundToggle");

let isSoundOn = true;
soundToggle.onclick = () => {
  isSoundOn = !isSoundOn;
  soundToggle.innerText = isSoundOn ? "🔊" : "🔈";
};

function speakResult(text) {
  if (isSoundOn && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel(); 
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }
}

document.getElementById("upload").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file) return;
  preview.src=URL.createObjectURL(file);
  preview.style.display="block";
  preview.onload=()=>{ process(preview); };
});

resetBtn.onclick=()=>{
  window.speechSynthesis.cancel();
  preview.style.display="none";
  resultDiv.innerHTML="Waiting...";
  resultDiv.className="result";
  details.innerHTML="";
  statusText.innerText="Upload a receipt";
  resetBtn.style.display="none";
  document.getElementById("upload").value = "";
  document.getElementById("upload").style.display = "inline-block";
};

async function process(img){
  statusText.innerText="Scanning receipt...";
  const { data:{ text } } = await Tesseract.recognize(img,'eng');
  analyze(text);
}

function analyze(text){
  let t = text.toLowerCase();
  
  // --- 1. SMART AMOUNT EXTRACTION ---
  // Step A: Look for numbers near currency keywords
  let amountMatch = text.match(/(?:₹|Rs\.?|INR|Amount|Amt|Total)\s*([\d,]+\.?\d*)/i);
  let amountValue = "";
  
  if (amountMatch) {
    amountValue = amountMatch[1];
  } else {
    // Step B: Fallback - Find the largest number with a decimal (common in receipts)
    let allNumbers = text.match(/\d+[.,]\d{2}/g); 
    if (allNumbers) {
      amountValue = allNumbers.sort((a, b) => parseFloat(b.replace(',','')) - parseFloat(a.replace(',','')))[0];
    } else {
      amountValue = "Not detected";
    }
  }

  // --- 2. TRANSACTION DIRECTION (Paid vs Received) ---
  let isReceived = t.includes("received from") || t.includes("from:") || t.includes("credited");
  let directionText = isReceived ? "Received from" : "Paid to";

  // --- 3. RECIPIENT/SENDER NAME ---
  let nameMatch = text.match(/(?:Paid to|To|Transfer to|From|Received from|Beneficiary)\s*:?\s*([A-Z\s]{3,25})/i);
  let personName = nameMatch ? nameMatch[1].trim() : "Unknown Person";

  // --- 4. TRUST SCORING ---
  let score = 0;
  if(/[a-zA-Z0-9.\-_]+@[a-zA-Z0-9.\-_]+/.test(t)) score+=2;
  if(amountValue !== "Not detected") score+=2;
  if(/\d{12}/.test(t)) score+=2;
  if(t.includes("success")||t.includes("paid")||t.includes("completed")) score+=2;
  
  let confidence = Math.min(Math.round((score/8)*100), 100);
  let isReal = score >= 4;

  // UI Updates
  resultDiv.className = "result " + (isReal ? "real" : "fake");
  resultDiv.innerHTML = `${isReal ? "🟢 VERIFIED" : "🔴 SUSPICIOUS"}<br>Trust Score: ${confidence}%`;

  details.innerHTML = `
    <hr>
    <strong>${directionText}:</strong> ${personName}<br>
    <strong>Amount:</strong> ₹${amountValue}<br>
    <strong>Risk:</strong> ${isReal ? "Low" : "High"}
  `;

  // --- 5. SMART VOICE MESSAGE ---
  let voiceMessage = isReal ? "Transaction Verified." : "Warning, suspicious receipt.";
  voiceMessage += ` ${directionText} ${personName}. Amount is ${amountValue} rupees.`;
  
  speakResult(voiceMessage);

  statusText.innerText = "Done";
  resetBtn.style.display = "inline-block";
  document.getElementById("upload").style.display = "none";
}
</script>
</body>
</html>
