<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay AI | Scanner</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --safe: #10b981;
            --alert: #ef4444;
        }

        body {
            margin: 0;
            font-family: -apple-system, system-ui, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 360px;
            background: #fff;
            padding: 25px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 { margin-bottom: 5px; color: #1e293b; font-size: 22px; }
        .subtitle { font-size: 12px; color: #64748b; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

        .video-wrapper {
            width: 100%;
            height: 350px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        video { width: 100%; height: 100%; object-fit: cover; }

        .scan-anim {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            animation: moveLine 2s infinite ease-in-out;
            display: none;
        }

        @keyframes moveLine { 0%, 100% { top: 10%; } 50% { top: 90%; } }

        .btn-main {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 14px;
            display: none;
            font-weight: 600;
            font-size: 14px;
        }

        #log { font-size: 11px; color: #94a3b8; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>SafePay AI</h2>
    <div class="subtitle">Neural Integrity System</div>

    <div class="video-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <div id="scanner" class="scan-anim"></div>
    </div>

    <button id="startBtn" class="btn-main" onclick="init()">Launch AI Engine</button>

    <div id="resultBox" class="result-box"></div>
    <div id="log">System Status: Standby</div>
</div>

<script>
    // Tera Teachable Machine Link
    const URL = "https://teachablemachine.withgoogle.com/models/i583iDC7K/";

    let model, maxPredictions;

    async function init() {
        const log = document.getElementById('log');
        document.getElementById('startBtn').style.display = "none";
        
        try {
            log.innerText = "Loading Neural Weights...";
            model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            maxPredictions = model.getTotalClasses();

            log.innerText = "Initializing Optical Feed...";
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            });
            document.getElementById('webcam').srcObject = stream;
            document.getElementById('scanner').style.display = "block";
            
            log.innerText = "Scanning Active...";
            loop();
        } catch (e) {
            log.innerText = "Error: Please check camera permissions.";
        }
    }

    async function loop() {
        const video = document.getElementById('webcam');
        
        setInterval(async () => {
            const prediction = await model.predict(video);
            
            let bestClass = "";
            let bestProb = 0;

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > bestProb) {
                    bestProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            displayResult(bestClass, bestProb);
        }, 1500);
    }

    function displayResult(className, prob) {
        const resBox = document.getElementById('resultBox');
        resBox.style.display = "block";
        const score = Math.round(prob * 100);

        // Logic check based on your class names (Real/Fake)
        if (className.toLowerCase().includes("real")) {
            resBox.style.background = "#dcfce7";
            resBox.style.color = "#166534";
            resBox.innerHTML = `AUTHENTIC: ${score}% Confidence`;
        } else {
            resBox.style.background = "#fee2e2";
            resBox.style.color = "#991b1b";
            resBox.innerHTML = `SUSPICIOUS: ${score}% Anomaly`;
        }
    }
</script>

</body>
</html>
