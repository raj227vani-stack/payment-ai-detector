<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AuthentiPay AI - Final Fix</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
:root { --p: #0ea5e9; --d: #0f172a; --w: #ffffff; }
body { margin:0; font-family:'Segoe UI', sans-serif; background: var(--d); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; color: #1e293b; text-align: center; }
.box { width:100%; max-width:380px; background:var(--w); border-radius:30px; padding:30px; box-shadow:0 25px 50px rgba(0,0,0,0.5); }

/* FIXED VIEWPORT */
#vBox { width: 100%; border-radius: 20px; overflow: hidden; background: #000; margin: 20px 0; border: 3px solid var(--p); display: none; position: relative; }
#vid, #prev { width: 100%; height: auto; display: block; }
.line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--p); box-shadow: 0 0 15px var(--p); animation: s 2s infinite linear; }
@keyframes s { 0% { top: 0%; } 100% { top: 100%; } }

.btn { width: 100%; padding: 16px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; margin-top: 12px; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
.b-m { background: var(--p); color: #fff; }
.b-a { background: #f1f5f9; color: var(--d); }

.dash { background: #f8fafc; border-radius: 20px; padding: 15px; margin-top: 20px; border: 1px solid #e2e8f0; }
.val { font-size: 32px; font-weight: 900; color: var(--d); }

#over { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; place-items: center; z-index: 100; backdrop-filter: blur(10px); }
.mod { background: #fff; padding: 30px; border-radius: 25px; width: 80%; }
</style>
</head>
<body>

<div class="box">
  <h2 style="margin:0; font-weight: 900; color: #000;">AuthentiPay <span style="color:var(--p)">AI</span></h2>
  <p style="font-size: 10px; color: #64748b; font-weight: 700; letter-spacing: 1px;">PRECISION VERIFIER</p>

  <div id="ui">
    <button class="btn b-m" onclick="startCam()">OPEN SCANNER</button>
    <button class="btn b-a" onclick="document.getElementById('fileIn').click()">UPLOAD RECEIPT</button>
  </div>
  <input type="file" id="fileIn" hidden accept="image/*">

  <div id="vBox">
    <div class="line"></div>
    <video id="vid" autoplay playsinline></video>
    <img id="prev" style="display:none">
  </div>
  <button id="snap" class="btn b-m" style="display:none" onclick="capture()">VERIFY NOW</button>

  <div class="dash">
    <div style="font-size: 11px; color: #64748b; font-weight: 700;">TOTAL REVENUE</div>
    <div class="val" id="totalDisp">₹0.00</div>
  </div>
</div>

<div id="over">
  <div class="mod">
    <div id="ico" style="font-size: 60px;"></div>
    <h2 id="tit" style="margin: 10px 0;"></h2>
    <p id="txt" style="color: #64748b; font-size: 14px; margin-bottom: 20px;"></p>
    <button class="btn b-m" onclick="location.reload()">NEXT SCAN</button>
  </div>
</div>

<canvas id="can" hidden></canvas>

<script>
let store = JSON.parse(localStorage.getItem('ap_final_fix_v2')) || { total: 0 };
let stream = null;

totalDisp.innerText = `₹${store.total.toLocaleString('en-IN')}`;

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    vid.srcObject = stream;
    vBox.style.display = "block";
    ui.style.display = "none";
    snap.style.display = "block";
  } catch (e) { alert("Camera Error: " + e); }
}

function capture() {
  const ctx = can.getContext('2d');
  can.width = vid.videoWidth; can.height = vid.videoHeight;
  ctx.drawImage(vid, 0, 0);
  const data = can.toDataURL('image/jpeg');
  vid.style.display = "none";
  prev.src = data;
  prev.style.display = "block";
  snap.style.display = "none";
  if(stream) stream.getTracks().forEach(t => t.stop());
  process(data);
}

fileIn.onchange = (e) => {
  const reader = new FileReader();
  reader.onload = (f) => {
    vBox.style.display = "block";
    prev.src = f.target.result;
    prev.style.display = "block";
    ui.style.display = "none";
    process(f.target.result);
  };
  reader.readAsDataURL(e.target.files[0]);
};

async function process(imgData) {
  const { data: { text } } = await Tesseract.recognize(imgData, 'eng');
  analyze(text);
}

function analyze(raw) {
  const r = raw.toLowerCase();
  
  // DEEP DETECTION
  const amtMatch = raw.match(/[\d,]+\.\d{2}/) || raw.match(/₹\s?[\d,]+/);
  let amt = amtMatch ? parseFloat(amtMatch[0].replace(/[₹,\s]/g, '')) : 0;
  
  const hasUpi = r.includes('@') || r.includes('upi') || r.includes('vpa');
  const hasTid = r.includes('ref') || r.includes('txn') || r.includes('trans') || /\d{12}/.test(r);
  const isOk = (r.includes('success') || r.includes('paid') || r.includes('received') || r.includes('complete'));

  const isReal = (amt > 0 && hasUpi && hasTid && isOk);

  if(isReal) {
    store.total += amt;
    localStorage.setItem('ap_final_fix_v2', JSON.stringify(store));
    totalDisp.innerText = `₹${store.total.toLocaleString('en-IN')}`;
    showModal("✅", "REAL PAYMENT", `Verified: ₹${amt}. All security markers found.`);
  } else {
    showModal("⚠️", "CHANCE OF FAKE", "UPI ID, Transaction ID, or Success status missing. Verify manually.");
  }
}

function showModal(i, t, x) {
  over.style.display = "grid";
  ico.innerText = i;
  tit.innerText = t;
  txt.innerText = x;
  const talk = new SpeechSynthesisUtterance(t === "REAL PAYMENT" ? "Payment verified." : "Warning, possible fake receipt.");
  window.speechSynthesis.speak(talk);
}
</script>
</body>
</html>
