<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AuthentiPay AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js"></script>

<style>
body{
    font-family:system-ui;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:#1e293b;
    padding:20px;
    border-radius:20px;
}

video{
    width:100%;
    border-radius:10px;
}

.report{
    background:#111827;
    margin-top:10px;
    padding:15px;
    border-radius:12px;
    font-size:14px;
}

.real{color:#22c55e;}
.fake{color:#ef4444;}

.line{
    margin:5px 0;
}
</style>
</head>

<body>

<div class="container">
<h2>AuthentiPay AI</h2>

<video id="video" autoplay></video>

<div id="report" class="report">Initializing...</div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let model;
let video=document.getElementById('video');
let canvas=document.getElementById('canvas');
let report=document.getElementById('report');

let buffer=[];

async function init(){
    model=await mobilenet.load();
    const stream=await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject=stream;
    scanLoop();
}
init();

function scanLoop(){
    setInterval(scan,2000);
}

async function scan(){

    if(video.readyState!==4) return;

    const ctx=canvas.getContext('2d');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    ctx.drawImage(video,0,0);

    const predictions=await model.classify(canvas);
    let aiProb=predictions[0].probability;

    const { data: { text } } = await Tesseract.recognize(canvas,'eng');

    let prob=(aiProb*0.7)+(patternScore(text)*0.1);

    buffer.push(prob);
    if(buffer.length>5) buffer.shift();

    let finalProb=buffer.reduce((a,b)=>a+b,0)/buffer.length;

    generateReport(finalProb,text);
}

function patternScore(text){
    let score=0;
    if(text.includes("@")) score++;
    if(/\d{12}/.test(text)) score++;
    if(text.toLowerCase().includes("paid")) score++;
    return score;
}

function detectApp(text){
    text=text.toLowerCase();
    if(text.includes("phonepe")) return "PhonePe";
    if(text.includes("gpay")||text.includes("google pay")) return "GPay";
    if(text.includes("paytm")) return "Paytm";
    return "Unknown";
}

function extract(text){
    let amount=text.match(/₹\d+/);
    let upi=text.match(/\w+@\w+/);
    let txn=text.match(/\d{10,}/);

    return {
        amount:amount?amount[0]:"N/A",
        upi:upi?upi[0]:"N/A",
        txn:txn?txn[0]:"N/A"
    };
}

function generateReport(prob,text){

    let confidence=Math.round(prob*100);
    let risk=prob>0.7?"LOW":prob>0.5?"MEDIUM":"HIGH";

    let data=extract(text);
    let app=detectApp(text);
    let time=new Date().toLocaleTimeString();

    if(prob>0.6){
        report.innerHTML=`
        <div class="real"><b>✔ VERIFIED TRANSACTION</b></div>

        <div class="line">💰 Amount: ${data.amount}</div>
        <div class="line">👤 To: ${data.upi}</div>
        <div class="line">📱 App: ${app}</div>
        <div class="line">🕒 Time: ${time}</div>
        <div class="line">🆔 Txn ID: ${data.txn}</div>

        <hr>

        <div class="line">🧠 Trust Score: ${confidence}/100</div>
        <div class="line">⚠ Risk Level: ${risk}</div>
        `;
    } else {
        report.innerHTML=`
        <div class="fake"><b>⚠ FAKE TRANSACTION DETECTED</b></div>

        <div class="line">💰 Amount: ${data.amount}</div>
        <div class="line">👤 To: ${data.upi}</div>
        <div class="line">📱 App: ${app}</div>
        <div class="line">🕒 Time: ${time}</div>
        <div class="line">🆔 Txn ID: ${data.txn}</div>

        <hr>

        <div class="line">🧠 Trust Score: ${confidence}/100</div>
        <div class="line">⚠ Risk Level: ${risk}</div>
        <div class="line">Reason: Missing or inconsistent data</div>
        `;
    }
}
</script>

</body>
</html>
