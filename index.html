<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay AI | Neural Fraud Detection</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root {
            --primary: #00f2ff;
            --success: #00ff88;
            --danger: #ff4444;
            --bg: #030712;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            margin: 0; background: var(--bg); color: white;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #030712 100%);
        }

        .app-card {
            width: 440px; background: var(--glass); backdrop-filter: blur(25px);
            border-radius: 32px; border: 1px solid rgba(255,255,255,0.1);
            padding: 35px; box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
        }

        .header { text-align: left; margin-bottom: 25px; }
        .header h1 { margin: 0; font-size: 28px; background: linear-gradient(to right, #00f2ff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { margin: 5px 0 0; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #64748b; }

        .viewport {
            width: 100%; height: 340px; background: #000; border-radius: 24px;
            margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05);
            position: relative; display: flex; align-items: center; justify-content: center;
        }

        video, #preview { width: 100%; height: 100%; object-fit: contain; display: none; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn {
            padding: 16px; border-radius: 16px; border: none; font-weight: 700;
            cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-live { background: linear-gradient(135deg, #00f2ff, #00d4ff); color: #000; }
        .btn-up { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

        .result-hud {
            margin-top: 25px; padding: 20px; border-radius: 20px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
            display: none; animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .verdict-line { font-size: 22px; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .data-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: #94a3b8; }
        .data-row span:last-child { color: white; font-weight: 600; }

        #loader { font-size: 12px; color: #475569; position: absolute; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>SafePay AI</h1>
        <p>B.Tech AIML | Unitedworld Institute of Technology</p>
    </div>

    <div class="viewport" id="v-port">
        <video id="vid" autoplay playsinline></video>
        <img id="preview" src="">
        <div id="loader">INITIALIZING AI CORE...</div>
    </div>

    <div class="btn-grid">
        <button class="btn btn-live" onclick="initLive()">Live Scan</button>
        <button class="btn btn-up" onclick="document.getElementById('file-in').click()">Upload</button>
        <input type="file" id="file-in" hidden accept="image/*" onchange="initFile(event)">
    </div>

    <div id="hud" class="result-hud">
        <div id="verdict" class="verdict-line">--</div>
        <div class="data-row"><span>Neural Confidence:</span> <span id="conf-val">0%</span></div>
        <div class="data-row"><span>Detected Amount:</span> <span id="amt-val">--</span></div>
        <div class="data-row"><span>Transaction Ref:</span> <span id="id-val">--</span></div>
    </div>

    <div style="margin-top: 20px; font-size: 10px; color: #475569; display: flex; align-items: center; gap: 8px; justify-content: center;">
        <input type="checkbox" id="voice" checked> ENABLE AI VOICE ASSISTANCE
    </div>
</div>

<canvas id="canv" style="display:none;"></canvas>

<script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/i583iDC7K/";
    let ai;

    // Load AI Model with Robust Error Handling
    (async () => {
        try {
            ai = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
            document.getElementById('loader').innerText = "SYSTEM ONLINE";
            document.getElementById('loader').style.color = "var(--success)";
        } catch(e) {
            document.getElementById('loader').innerText = "CORS ERROR: RUN VIA LIVE SERVER";
            document.getElementById('loader').style.color = "var(--danger)";
        }
    })();

    async function initLive() {
        const v = document.getElementById('vid');
        v.style.display="block"; document.getElementById('preview').style.display="none";
        document.getElementById('loader').style.display="none";
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
            v.srcObject = stream;
            // Scan loop every 3 seconds for Live Mode
            setInterval(() => { if(v.srcObject) analyze(v); }, 3000);
        } catch(e) { alert("Camera Permission Required!"); }
    }

    function initFile(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        const img = document.getElementById('preview');
        img.style.display="block"; document.getElementById('vid').style.display="none";
        document.getElementById('loader').style.display="none";

        reader.onload = (f) => {
            img.src = f.target.result;
            // AUTO-SCAN TRIGGER: Jaise hi photo load hogi, analyze start ho jayega
            img.onload = () => analyze(img);
        };
        reader.readAsDataURL(file);
    }

    async function analyze(source) {
        if(!ai) return;

        // Visual Classification (Teachable Machine)
        const pred = await ai.predict(source);
        const top = pred.sort((a,b) => b.probability - a.probability)[0];

        // OCR Extraction (Tesseract)
        const c = document.getElementById('canv');
        c.width = source.videoWidth || source.naturalWidth;
        c.height = source.videoHeight || source.naturalHeight;
        c.getContext('2d').drawImage(source, 0, 0);
        
        const ocr = await Tesseract.recognize(c, 'eng');
        const text = ocr.data.text.toLowerCase();

        // Accuracy Check: Minimum 70% probability for result
        if(top.probability > 0.70) {
            updateUI(top, text);
        }
    }

    function updateUI(res, text) {
        const hud = document.getElementById('hud');
        hud.style.display = "block";
        
        const isReal = res.className.toLowerCase().includes("real");
        const v = document.getElementById('verdict');
        v.innerText = isReal ? "AUTHENTIC RECEIPT" : "FRAUD DETECTED";
        v.style.color = isReal ? "var(--success)" : "var(--danger)";
        hud.style.borderColor = isReal ? "var(--success)" : "var(--danger)";
        
        document.getElementById('conf-val').innerText = (res.probability * 100).toFixed(1) + "%";
        document.getElementById('amt-val').innerText = (text.match(/[₹rs]\s?\d+/i) || ["--"])[0].toUpperCase();
        document.getElementById('id-val').innerText = (text.match(/\d{10,12}/) || ["--"])[0];

        if(document.getElementById('voice').checked) {
            const speech = new SpeechSynthesisUtterance(isReal ? "Transaction Verified" : "Warning: Fraud Detected");
            window.speechSynthesis.speak(speech);
        }
    }
</script>
</body>
</html>
