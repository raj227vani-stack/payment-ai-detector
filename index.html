<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AuthentiPay AI - Deep Scan Edition</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
:root { --primary: #0ea5e9; --dark: #0f172a; --success: #10b981; --danger: #ef4444; --bg: #f8fafc; }
body { margin:0; font-family:'Inter', sans-serif; background: var(--dark); display:flex; justify-content:center; align-items:center; min-height:100vh; padding: 20px; color: #1e293b; }
.container { width:100%; max-width:420px; background:white; border-radius:32px; padding:30px; box-shadow:0 40px 80px rgba(0,0,0,0.6); text-align:center; position: relative; }

/* Scanner UI */
.scanner-container { position: relative; width: 100%; border-radius: 24px; overflow: hidden; background: #f1f5f9; margin-top: 20px; border: 2px solid #e2e8f0; display: none; aspect-ratio: 4/5; }
video, #preview { width: 100%; height: 100%; object-fit: contain; background: #000; }
.scan-line { position: absolute; top: 10%; left: 0; width: 100%; height: 3px; background: var(--primary); box-shadow: 0 0 15px var(--primary); animation: scan-action 2s infinite linear; z-index: 10; display: none; }
@keyframes scan-action { 0% { top: 10%; } 100% { top: 90%; } }

/* Controls */
.btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
.btn { padding: 16px; border-radius: 16px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 13px; }
.btn-cam { background: var(--primary); color: white; }
.btn-up { background: #e2e8f0; color: var(--dark); }
.btn-capture { background: var(--dark); color: white; width: 100%; margin-top: 15px; display: none; border-radius: 16px; }

/* Dashboard */
.dashboard { margin-top: 25px; background: var(--bg); border-radius: 24px; padding: 20px; text-align: left; border: 1px solid #edf2f7; }
.dash-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
.dash-val { font-size: 24px; font-weight: 800; color: var(--dark); margin-bottom: 12px; }

/* Result Panel */
#liveDetails { margin-top: 15px; background: #fff; border: 2px dashed #e2e8f0; border-radius: 20px; padding: 15px; text-align: left; display: none; }
.detail-item { font-size: 12px; margin-bottom: 8px; color: #64748b; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.detail-item span { color: var(--dark); font-weight: 800; text-align: right; max-width: 60%; word-break: break-all; }

#popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
.popup-card { background: white; padding: 35px; border-radius: 32px; width: 85%; max-width: 340px; text-align: center; }
#soundBtn { position: absolute; top: 20px; right: 20px; background: #f1f5f9; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
</style>
</head>
<body>

<div class="container">
  <button id="soundBtn" onclick="toggleSound()">🔊</button>
  <h2 style="margin:0; font-size: 26px; font-weight: 800;">AuthentiPay <span style="color:var(--primary);">AI</span></h2>
  <p style="font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase;">Deep Scanning Tech</p>

  <div class="btn-group" id="mainBtns">
    <button class="btn btn-cam" onclick="startScanner()">LIVE SCAN</button>
    <button class="btn btn-up" onclick="document.getElementById('fileIn').click()">UPLOAD</button>
  </div>
  <input type="file" id="fileIn" accept="image/*" style="display:none">

  <div class="scanner-container" id="sContainer">
    <div class="scan-line" id="sLine"></div>
    <video id="video" autoplay playsinline></video>
    <img id="preview" alt="Deep Scan Preview" style="display:none;">
  </div>
  <button id="captureBtn" class="btn btn-capture">ANALYZE IMAGE</button>

  <div id="status" style="margin-top:20px; font-weight: 800; color: var(--primary); font-size: 11px;">SYSTEM READY</div>

  <div class="dashboard">
    <div class="dash-label">Total Revenue</div>
    <div id="dTotal" class="dash-val">₹0.00</div>
    <div style="display: flex; justify-content: space-between;">
        <div><div class="dash-label">Success</div><div id="dCount" class="dash-val" style="font-size: 18px; color: var(--success); margin:0;">0</div></div>
        <div><div class="dash-label">Blocked</div><div id="dFake" class="dash-val" style="font-size: 18px; color: var(--danger); margin:0;">0</div></div>
    </div>
  </div>

  <div id="liveDetails">
    <div class="detail-item">Party Name <span id="resName">-</span></div>
    <div class="detail-item">Amount <span id="resAmt">-</span></div>
    <div class="detail-item">ID/UPI <span id="resID">-</span></div>
  </div>
</div>

<div id="popup">
  <div class="popup-card">
    <div id="popIcon" style="font-size: 55px; margin-bottom: 10px;"></div>
    <h3 id="popTitle" style="margin:0; font-size: 22px; font-weight: 800;"></h3>
    <div id="popMsg" style="margin: 20px 0; font-size: 14px; color: #64748b; line-height: 1.5;"></div>
    <button class="btn btn-cam" style="width: 100%;" onclick="location.reload()">NEXT SCAN</button>
  </div>
</div>

<canvas id="processingCanvas" style="display:none"></canvas>

<script>
let stats = JSON.parse(localStorage.getItem('ap_deep_v1')) || { total: 0, count: 0, fake: 0 };
let txnLog = JSON.parse(localStorage.getItem('ap_log_deep_v1')) || [];
let isSoundOn = true;
let stream = null;

function toggleSound() { isSoundOn = !isSoundOn; document.getElementById('soundBtn').innerText = isSoundOn ? "🔊" : "🔈"; }
function speak(msg) { if(isSoundOn) { window.speechSynthesis.cancel(); const s = new SpeechSynthesisUtterance(msg); s.rate=0.9; window.speechSynthesis.speak(s); } }

function updateUI() {
  document.getElementById('dTotal').innerText = `₹${stats.total.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
  document.getElementById('dCount').innerText = stats.count;
  document.getElementById('dFake').innerText = stats.fake;
  localStorage.setItem('ap_deep_v1', JSON.stringify(stats));
  localStorage.setItem('ap_log_deep_v1', JSON.stringify(txnLog));
}
updateUI();

async function startScanner() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
    document.getElementById('video').srcObject = stream;
    document.getElementById('sContainer').style.display = "block";
    document.getElementById('mainBtns').style.display = "none";
    document.getElementById('captureBtn').style.display = "block";
  } catch (e) { alert("Camera Permission Required"); }
}

captureBtn.onclick = () => {
  const canvas = document.getElementById('processingCanvas');
  const video = document.getElementById('video');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  
  // BIOMETRIC STYLE PRE-PROCESSING
  ctx.filter = "contrast(1.5) grayscale(1) brightness(1.0)";
  ctx.drawImage(video, 0, 0);
  
  const data = canvas.toDataURL('image/jpeg', 1.0);
  video.style.display = "none";
  document.getElementById('preview').src = data;
  document.getElementById('preview').style.display = "block";
  document.getElementById('sLine').style.display = "block";
  document.getElementById('captureBtn').style.display = "none";
  if(stream) stream.getTracks().forEach(t => t.stop());
  runDeepScan(data);
};

fileIn.onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('sContainer').style.display = "block";
    document.getElementById('video').style.display = "none";
    document.getElementById('preview').src = ev.target.result;
    document.getElementById('preview').style.display = "block";
    document.getElementById('mainBtns').style.display = "none";
    runDeepScan(ev.target.result);
  };
  reader.readAsDataURL(file);
};

async function runDeepScan(src) {
  document.getElementById('status').innerText = "CORE SCANNING...";
  const worker = await Tesseract.createWorker();
  await worker.loadLanguage('eng');
  await worker.initialize('eng');
  // Setting high threshold for cleaner results
  await worker.setParameters({ tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz₹,.@' });
  
  const { data: { text } } = await worker.recognize(src);
  await worker.terminate();
  analyze(text);
}

function analyze(text) {
  const t = text.toLowerCase();
  
  // 1. ADVANCED AMOUNT DETECTION (Smart Filter)
  let amount = 0;
  let currencyMatches = text.match(/(?:₹|Rs|INR)\s*([\d,]+\.\d{2})|([\d,]+\.\d{2})/gi);
  if(currencyMatches) {
      // Find the one that looks most like a payment (usually the largest decimal)
      let cleanAmounts = currencyMatches.map(a => parseFloat(a.replace(/[^\d.]/g, ''))).filter(a => a > 0);
      amount = Math.max(...cleanAmounts);
  }

  // 2. DEEP PARTY DETECTION (Paid To / Received From)
  let party = "Verified Merchant";
  let nameMatch = text.match(/(?:Paid to|To|From|Received from|Sender|Receiver|Beneficiary)\s*:?\s*([A-Z\s]{3,20})/i);
  if(nameMatch) party = nameMatch[1].trim();

  // 3. TRANSACTION IDENTITY (UPI / REF)
  let upi = (text.match(/[a-zA-Z0-9.\-_]+@[a-zA-Z0-9.\-_]+/) || ["Unknown UPI"])[0];
  let refID = (text.match(/\d{12}/) || ["TXID"+Date.now()])[0];
  
  let isDup = txnLog.includes(refID);
  
  // 4. ENTERPRISE LOGIC: Double verification
  const statusKeywords = t.match(/(success|paid|completed|received|successful)/);
  const isReal = (statusKeywords && amount > 0) && !isDup;

  // DISPLAY UPDATES
  document.getElementById('liveDetails').style.display = "block";
  document.getElementById('resName').innerText = party;
  document.getElementById('resAmt').innerText = "₹" + amount;
  document.getElementById('resID').innerText = upi !== "Unknown UPI" ? upi : refID;

  if(isReal) {
      stats.total += amount; stats.count++; txnLog.push(refID);
      speak(`Received ${amount} rupees from ${party}`);
  } else if(isDup) {
      speak("Transaction already registered.");
  } else {
      stats.fake++;
      speak("Verification failed. Blocked.");
  }
  updateUI();

  // POPUP
  document.getElementById('popup').style.display = "flex";
  document.getElementById('popIcon').innerText = isReal ? "✅" : "🛡️";
  document.getElementById('popTitle').innerText = isReal ? "Verified" : "Risk Detected";
  document.getElementById('popMsg').innerHTML = isReal ? 
    `Payment of <b>₹${amount}</b> from <b>${party}</b> is confirmed.` : 
    `Security scan could not verify this receipt. Possible mismatch or scan error.`;
}
</script>
</body>
</html>
