<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AuthentiPay AI - Pro Edition</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
:root { --primary: #0ea5e9; --dark: #0f172a; --success: #10b981; --danger: #ef4444; --bg: #f8fafc; }
body { margin:0; font-family:'Inter', sans-serif; background: var(--dark); display:flex; justify-content:center; align-items:center; min-height:100vh; padding: 20px; color: #1e293b; }
.container { width:100%; max-width:420px; background:white; border-radius:32px; padding:30px; box-shadow:0 40px 80px rgba(0,0,0,0.6); text-align:center; position: relative; }

.scanner-container { position: relative; width: 100%; border-radius: 24px; overflow: hidden; background: #f1f5f9; margin-top: 20px; border: 2px solid #e2e8f0; display: none; aspect-ratio: 4/5; }
video, #preview { width: 100%; height: 100%; object-fit: contain; background: #000; }
.scan-line { position: absolute; top: 10%; left: 0; width: 100%; height: 3px; background: var(--primary); box-shadow: 0 0 15px var(--primary); animation: scan-action 2s infinite linear; z-index: 10; display: none; }
@keyframes scan-action { 0% { top: 10%; } 100% { top: 90%; } }

.btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
.btn { padding: 16px; border-radius: 16px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 13px; }
.btn-cam { background: var(--primary); color: white; }
.btn-up { background: #e2e8f0; color: var(--dark); }
.btn-capture { background: var(--dark); color: white; width: 100%; margin-top: 15px; display: none; border-radius: 16px; }

.dashboard { margin-top: 30px; background: var(--bg); border-radius: 24px; padding: 20px; text-align: left; border: 1px solid #edf2f7; }
.dash-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
.dash-val { font-size: 24px; font-weight: 800; color: var(--dark); margin-bottom: 15px; }

#popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
.popup-card { background: white; padding: 35px; border-radius: 32px; width: 85%; max-width: 340px; text-align: center; }
#soundBtn { position: absolute; top: 20px; right: 20px; background: #f1f5f9; border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

<div class="container">
  <button id="soundBtn" onclick="toggleSound()">🔊</button>
  <h2 style="margin:0; font-size: 26px; font-weight: 800;">AuthentiPay <span style="color:var(--primary);">AI</span></h2>
  <p style="font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase;">Payment Guardian</p>

  <div class="btn-group" id="mainBtns">
    <button class="btn btn-cam" onclick="startScanner()">LIVE SCAN</button>
    <button class="btn btn-up" onclick="document.getElementById('fileIn').click()">UPLOAD</button>
  </div>
  <input type="file" id="fileIn" accept="image/*" style="display:none">

  <div class="scanner-container" id="sContainer">
    <div class="scan-line" id="sLine"></div>
    <video id="video" autoplay playsinline></video>
    <img id="preview" alt="Preview Image" style="display:none;">
  </div>
  <button id="captureBtn" class="btn btn-capture">VERIFY NOW</button>

  <div id="status" style="margin-top:20px; font-weight: 800; color: var(--primary); font-size: 11px;">SYSTEM READY</div>

  <div class="dashboard">
    <div class="dash-label">Total Revenue</div>
    <div id="dTotal" class="dash-val">₹0.00</div>
    <div style="display: flex; justify-content: space-between;">
        <div><div class="dash-label">Success</div><div id="dCount" class="dash-val" style="font-size: 18px; color: var(--success); margin:0;">0</div></div>
        <div><div class="dash-label">Blocked</div><div id="dFake" class="dash-val" style="font-size: 18px; color: var(--danger); margin:0;">0</div></div>
    </div>
  </div>
</div>

<div id="popup">
  <div class="popup-card">
    <div id="popIcon" style="font-size: 55px; margin-bottom: 10px;"></div>
    <h3 id="popTitle" style="margin:0; font-size: 22px; font-weight: 800;"></h3>
    <div id="popDetails" style="margin: 20px 0; text-align: left; background: #f8fafc; padding: 18px; border-radius: 16px; font-size: 13px; line-height: 1.6;"></div>
    <button class="btn btn-cam" style="width: 100%;" onclick="location.reload()">NEXT CUSTOMER</button>
  </div>
</div>

<canvas id="processingCanvas" style="display:none"></canvas>

<script>
let stats = JSON.parse(localStorage.getItem('ap_pro_v6')) || { total: 0, count: 0, fake: 0 };
let txnLog = JSON.parse(localStorage.getItem('ap_log_v6')) || [];
let stream = null;
let isSoundOn = true;

function toggleSound() { isSoundOn = !isSoundOn; document.getElementById('soundBtn').innerText = isSoundOn ? "🔊" : "🔈"; }
function speak(msg) { if(isSoundOn) { window.speechSynthesis.cancel(); const s = new SpeechSynthesisUtterance(msg); s.rate=0.9; window.speechSynthesis.speak(s); } }

function updateUI() {
  document.getElementById('dTotal').innerText = `₹${stats.total.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
  document.getElementById('dCount').innerText = stats.count;
  document.getElementById('dFake').innerText = stats.fake;
  localStorage.setItem('ap_pro_v6', JSON.stringify(stats));
  localStorage.setItem('ap_log_v6', JSON.stringify(txnLog));
}
updateUI();

async function startScanner() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: 1280 } });
    document.getElementById('video').srcObject = stream;
    document.getElementById('sContainer').style.display = "block";
    document.getElementById('video').style.display = "block";
    document.getElementById('preview').style.display = "none";
    document.getElementById('mainBtns').style.display = "none";
    document.getElementById('captureBtn').style.display = "block";
    document.getElementById('status').innerText = "CAPTURE RECEIPT";
  } catch (e) { alert("Camera Error"); }
}

captureBtn.onclick = () => {
  const canvas = document.getElementById('processingCanvas');
  const video = document.getElementById('video');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.filter = "contrast(1.2) brightness(1.1)"; // Best Approach: Auto-enhance for OCR
  ctx.drawImage(video, 0, 0);
  const data = canvas.toDataURL('image/jpeg', 1.0);
  video.style.display = "none";
  document.getElementById('preview').src = data;
  document.getElementById('preview').style.display = "block";
  document.getElementById('sLine').style.display = "block";
  document.getElementById('captureBtn').style.display = "none";
  if(stream) stream.getTracks().forEach(t => t.stop());
  runOCR(data);
};

fileIn.onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const data = event.target.result;
    document.getElementById('sContainer').style.display = "block";
    document.getElementById('video').style.display = "none";
    const p = document.getElementById('preview');
    p.src = data; p.style.display = "block";
    document.getElementById('mainBtns').style.display = "none";
    document.getElementById('sLine').style.display = "block";
    runOCR(data);
  };
  reader.readAsDataURL(file);
};

async function runOCR(src) {
  document.getElementById('status').innerText = "AI VERIFYING...";
  const { data: { text } } = await Tesseract.recognize(src, 'eng');
  analyze(text);
}

function analyze(text) {
  const t = text.toLowerCase();
  
  // 1. Better Amount Detection
  let amount = 0;
  let decimals = text.match(/\d{1,3}(?:,\d{3})*(?:\.\d{2})/g); 
  if(decimals) {
      amount = parseFloat(decimals.sort((a,b) => b.length - a.length)[0].replace(/,/g,''));
  } else {
      let symbolMatch = text.match(/(?:₹|Rs|INR|total)\s*([\d,]+)/i);
      if(symbolMatch) amount = parseFloat(symbolMatch[1].replace(/,/g,''));
  }

  // 2. Party Name Detection
  let partyMatch = text.match(/(?:Paid to|To|Transfer to|From|Received from|Beneficiary)\s*:?\s*([A-Z\s]{3,25})/i);
  let partyName = partyMatch ? partyMatch[1].trim() : "Verified Merchant";

  // 3. Txn ID Detection
  let txID = (text.match(/\d{12}/) || ["TXN"+Date.now()])[0];
  let isDup = txnLog.includes(txID);
  
  // Best Approach Fix: If Txn ID and Amount exist, it's 90% likely real.
  const hasKeywords = t.match(/(success|paid|completed|received|successful|payment)/);
  const isReal = (hasKeywords || (amount > 0 && txID.length >= 12)) && !isDup;
  
  if(isReal) { 
      stats.total += amount; stats.count++; txnLog.push(txID); 
      speak(`Verified ${amount} rupees.`);
  } else if(isDup) {
      speak("Already used.");
  } else { 
      stats.fake++; 
      speak("Security risk."); 
  }
  updateUI();

  document.getElementById('popup').style.display = "flex";
  const icon = document.getElementById('popIcon');
  const title = document.getElementById('popTitle');
  const det = document.getElementById('popDetails');

  if(isDup) {
    icon.innerText = "⚠️"; title.innerText = "Duplicate Entry";
    det.innerHTML = `<strong>ID:</strong> ${txID}<br>Already scanned.`;
  } else if(isReal) {
    icon.innerText = "✅"; title.innerText = "Verified Authentic";
    det.innerHTML = `<strong>Amount:</strong> ₹${amount.toLocaleString('en-IN')}<br><strong>ID:</strong> ${txID}`;
  } else {
    icon.innerText = "🛡️"; title.innerText = "Security Risk";
    det.innerHTML = `Pattern mismatch or invalid receipt.`;
  }
}
</script>
</body>
</html>
