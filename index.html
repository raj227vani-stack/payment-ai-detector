<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay | Business Elite</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        :root {
            --accent: #6366f1;
            --success: #22c55e;
            --danger: #ef4444;
            --dark-bg: #0f172a;
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--dark-bg);
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .business-card {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            border-radius: 35px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            position: relative;
        }

        /* Business Branding */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -1px; color: var(--accent); }
        .badge { background: rgba(99, 102, 241, 0.1); color: var(--accent); padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: bold; border: 1px solid var(--accent); }

        /* Stats Row for Shop Owners */
        .stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: #334155; padding: 12px; border-radius: 15px; text-align: left; }
        .stat-val { display: block; font-size: 18px; font-weight: bold; }
        .stat-label { font-size: 10px; color: #94a3b8; }

        .camera-container {
            position: relative;
            width: 100%;
            height: 300px;
            border-radius: 25px;
            overflow: hidden;
            background: #000;
            border: 2px solid #334155;
        }

        #video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }

        /* AI Scan Effect */
        .scanner-glow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(0deg, rgba(99, 102, 241, 0.2) 0%, transparent 50%);
            animation: pulse 2s infinite;
            display: none;
        }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 0.7; } 100% { opacity: 0.3; } }

        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 20px;
            font-weight: 800;
            display: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .success-res { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid var(--success); }
        .error-res { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
    </style>
</head>
<body>

<div class="business-card">
    <div class="header">
        <div class="logo">SafePay</div>
        <div class="badge">BUSINESS PRO</div>
    </div>

    <div class="stats">
        <div class="stat-box">
            <span class="stat-val">24</span>
            <span class="stat-label">Verified Today</span>
        </div>
        <div class="stat-box">
            <span class="stat-val" style="color:var(--danger)">0</span>
            <span class="stat-label">Fraud Alerts</span>
        </div>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
        <div id="glow" class="scanner-glow"></div>
    </div>

    <button id="mainBtn" class="btn-action" onclick="handleScan()">Activate Security</button>
    <div id="result"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    let model;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const resultDiv = document.getElementById('result');
    const glow = document.getElementById('glow');

    async function init() {
        model = await mobilenet.load();
        console.log("Business Logic Active");
    }
    init();

    async function handleScan() {
        if (!video.srcObject) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            document.getElementById('mainBtn').innerText = "Scan Payment Receipt";
            return;
        }

        glow.style.display = 'block';
        resultDiv.style.display = 'none';

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const predictions = await model.classify(canvas);
        
        // Color heuristic
        const frameData = ctx.getImageData(canvas.width/2, canvas.height/2, 100, 100).data;
        let hasUIColors = false;
        for(let i=0; i<frameData.length; i+=4) {
            if(frameData[i+1] > 100 || frameData[i+2] > 100) hasUIColors = true; 
        }

        setTimeout(() => {
            glow.style.display = 'none';
            resultDiv.style.display = 'block';

            const top = predictions[0];
            const isScreen = top.className.toLowerCase().match(/(screen|monitor|display|web)/);
            
            if ((isScreen && top.probability > 0.4) || (hasUIColors && top.probability > 0.6)) {
                resultDiv.innerHTML = "✓ Payment Verified<br><span style='font-size:10px;'>Transaction Securely Matched</span>";
                resultDiv.className = "success-res";
                speak("Payment Verified");
            } else {
                resultDiv.innerHTML = "⚠ Warning: Potential Fraud<br><span style='font-size:10px;'>Inconsistent Metadata</span>";
                resultDiv.className = "error-res";
                speak("Warning! Potential Fraud");
            }
        }, 1500);
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    }
</script>
</body>
</html>
