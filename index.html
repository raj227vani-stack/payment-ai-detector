<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AuthentiPay AI - Pro Deep Scan</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
:root { --primary: #0ea5e9; --dark: #0f172a; --success: #10b981; --danger: #ef4444; --bg: #f8fafc; }
body { margin:0; font-family:'Inter', sans-serif; background: var(--dark); display:flex; justify-content:center; align-items:center; min-height:100vh; padding: 15px; color: #1e293b; overflow-x: hidden; }
.container { width:100%; max-width:400px; background:white; border-radius:32px; padding:25px; box-shadow:0 40px 80px rgba(0,0,0,0.6); text-align:center; position: relative; }

/* 1. SMART CROP VIEWPORT (Face/Hand Filter) */
.scanner-container { position: relative; width: 100%; border-radius: 24px; overflow: hidden; background: #000; margin-top: 15px; border: 2px solid var(--primary); display: none; aspect-ratio: 1/1; }
video, #preview { width: 100%; height: 100%; object-fit: cover; }
.crop-overlay { position: absolute; top: 15%; left: 15%; width: 70%; height: 70%; border: 2px solid var(--primary); border-radius: 12px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.6); z-index: 5; pointer-events: none; }
.scan-line { position: absolute; top: 15%; left: 15%; width: 70%; height: 2px; background: var(--primary); box-shadow: 0 0 15px var(--primary); animation: scan-action 2.5s infinite ease-in-out; z-index: 10; display: none; }
@keyframes scan-action { 0% { top: 15%; } 50% { top: 85%; } 100% { top: 15%; } }

/* 2. CONTROLS & LANGUAGE TOGGLE */
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.lang-select { background: #f1f5f9; border-radius: 12px; padding: 6px 12px; font-size: 11px; font-weight: 800; border: none; cursor: pointer; color: var(--primary); }
#soundBtn { background: #f1f5f9; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-size: 16px; }

.btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
.btn { padding: 15px; border-radius: 16px; border: none; font-weight: 800; cursor: pointer; font-size: 12px; transition: 0.3s; }
.btn-cam { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3); }
.btn-up { background: #e2e8f0; color: var(--dark); }

/* 3. REVENUE DASHBOARD */
.dashboard { margin-top: 15px; background: var(--bg); padding: 15px; border-radius: 20px; text-align: left; border: 1px solid #e2e8f0; }
.dash-title { font-size: 10px; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
.dash-rev { font-size: 24px; font-weight: 900; color: var(--dark); margin-bottom: 5px; }

/* 4. LIVE DETECTION PANEL (Party, Amt, UPI) */
#liveInfo { background: white; border: 2px dashed #e2e8f0; border-radius: 18px; padding: 15px; margin-top: 15px; text-align: left; display: none; }
.info-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; font-weight: 600; border-bottom: 1px solid #f8fafc; }
.info-row span { color: var(--dark); font-weight: 800; text-align: right; max-width: 60%; word-break: break-all; }

#popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
.popup-card { background: white; padding: 30px; border-radius: 32px; width: 85%; max-width: 340px; text-align: center; }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <select id="voiceLang" class="lang-select">
      <option value="hi-IN">Hindi Voice</option>
      <option value="en-US">English Voice</option>
    </select>
    <button id="soundBtn" onclick="toggleSound()">🔊</button>
  </div>

  <h2 style="margin:0; font-size: 26px; font-weight: 900;">AuthentiPay <span style="color:var(--primary);">AI</span></h2>
  <p style="font-size: 10px; color: #94a3b8; font-weight: 800; text-transform: uppercase;">Next-Gen Deep Scan</p>

  <div class="btn-group" id="mainBtns">
    <button class="btn btn-cam" onclick="startScanner()">SCAN LIVE</button>
    <button class="btn btn-up" onclick="document.getElementById('fileIn').click()">UPLOAD</button>
  </div>
  <input type="file" id="fileIn" accept="image/*" style="display:none">

  <div class="scanner-container" id="sContainer">
    <div class="crop-overlay"></div>
    <div class="scan-line" id="sLine"></div>
    <video id="video" autoplay playsinline></video>
    <img id="preview" style="display:none">
  </div>
  <button id="captureBtn" class="btn btn-cam" style="width:100%; margin-top:10px; display:none;">CROP & ANALYZE</button>

  <div class="dashboard">
    <div class="dash-title">Total Revenue</div>
    <div id="dTotal" class="dash-rev">₹0.00</div>
  </div>

  <div id="liveInfo">
    <div class="info-row">Party Name <span id="outName">-</span></div>
    <div class="info-row">Amount Detected <span id="outAmt">-</span></div>
    <div class="info-row">Ref/UPI ID <span id="outID">-</span></div>
  </div>
</div>

<div id="popup">
  <div class="popup-card">
    <div id="popIcon" style="font-size: 55px; margin-bottom: 10px;"></div>
    <h3 id="popTitle" style="margin:0; font-weight: 900; font-size: 22px;"></h3>
    <p id="popMsg" style="color: #64748b; font-size: 13px; margin: 15px 0; line-height: 1.5;"></p>
    <button class="btn btn-cam" style="width: 100%;" onclick="location.reload()">NEXT CUSTOMER</button>
  </div>
</div>

<canvas id="deepScanCanvas" style="display:none"></canvas>

<script>
let stats = JSON.parse(localStorage.getItem('ap_deep_scan_v3')) || { total: 0 };
let isSoundOn = true;
let stream = null;

function toggleSound() { isSoundOn = !isSoundOn; document.getElementById('soundBtn').innerText = isSoundOn ? "🔊" : "🔈"; }

// 5. BILINGUAL VOICE LOGIC
function speak(msg) {
  if (!isSoundOn) return;
  window.speechSynthesis.cancel();
  const lang = document.getElementById('voiceLang').value;
  const s = new SpeechSynthesisUtterance(msg);
  s.lang = lang; s.rate = 0.95;
  window.speechSynthesis.speak(s);
}

document.getElementById('dTotal').innerText = `₹${stats.total.toLocaleString('en-IN')}`;

async function startScanner() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
    document.getElementById('video').srcObject = stream;
    document.getElementById('sContainer').style.display = "block";
    document.getElementById('mainBtns').style.display = "none";
    document.getElementById('captureBtn').style.display = "block";
    document.getElementById('sLine').style.display = "block";
  } catch (e) { alert("Camera Permission Required"); }
}

// 6. DEEP SCANNING & SMART CROP
captureBtn.onclick = () => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('deepScanCanvas');
  const ctx = canvas.getContext('2d');
  
  canvas.width = 800; canvas.height = 800;
  // Adaptive Filters for Accuracy
  ctx.filter = "contrast(1.6) grayscale(1) brightness(1.1)"; 
  // Capturing center 70% to exclude surrounding hands/faces
  ctx.drawImage(video, video.videoWidth*0.15, video.videoHeight*0.15, video.videoWidth*0.7, video.videoHeight*0.7, 0, 0, 800, 800);
  
  const data = canvas.toDataURL('image/jpeg', 1.0);
  video.style.display = "none";
  document.getElementById('preview').src = data;
  document.getElementById('preview').style.display = "block";
  document.getElementById('captureBtn').style.display = "none";
  if(stream) stream.getTracks().forEach(t => t.stop());
  runDeepScan(data);
};

fileIn.onchange = (e) => {
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById('sContainer').style.display = "block";
    document.getElementById('video').style.display = "none";
    document.getElementById('preview').src = ev.target.result;
    document.getElementById('preview').style.display = "block";
    document.getElementById('mainBtns').style.display = "none";
    runDeepScan(ev.target.result);
  };
  reader.readAsDataURL(e.target.files[0]);
};

async function runDeepScan(src) {
  const worker = await Tesseract.createWorker();
  await worker.loadLanguage('eng');
  await worker.initialize('eng');
  await worker.setParameters({ 
    tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz₹,.@' 
  });
  
  const { data: { text } } = await worker.recognize(src);
  await worker.terminate();
  analyze(text);
}

function analyze(text) {
  const t = text.toLowerCase();
  const lang = document.getElementById('voiceLang').value;

  // 7. EXTRACTION LOGIC
  let amount = 0;
  let amtMatch = text.match(/[\d,]+\.\d{2}/g);
  if(amtMatch) amount = parseFloat(amtMatch.sort((a,b) => b.length - a.length)[0].replace(/,/g,''));

  let party = (text.match(/(?:To|From|Paid|Received|Beneficiary|Name)\s*:?\s*([A-Z\s]{3,15})/i) || [null, "Merchant"])[1].trim();
  let upi = (text.match(/[a-zA-Z0-9.\-_]+@[a-zA-Z0-9.\-_]+/) || text.match(/\d{12}/) || ["Not Found"])[0];

  const isReal = (t.includes('success') || t.includes('paid') || t.includes('completed') || t.includes('received')) && amount > 0;

  // Update Live Panel
  document.getElementById('liveInfo').style.display = "block";
  document.getElementById('outName').innerText = party;
  document.getElementById('outAmt').innerText = "₹" + amount;
  document.getElementById('outID').innerText = upi;

  if(isReal) {
    stats.total += amount;
    localStorage.setItem('ap_deep_scan_v3', JSON.stringify(stats));
    document.getElementById('dTotal').innerText = `₹${stats.total.toLocaleString('en-IN')}`;
    
    // Voice Message
    let msg = lang === "hi-IN" ? `${party} se ${amount} rupaye prapt hue` : `Received ${amount} rupees from ${party}`;
    speak(msg);
  } else {
    let msg = lang === "hi-IN" ? "Payment verify nahi ho paya" : "Payment verification failed";
    speak(msg);
  }

  // 8. FINAL POPUP
  document.getElementById('popup').style.display = "flex";
  document.getElementById('popIcon').innerText = isReal ? "✅" : "🛡️";
  document.getElementById('popTitle').innerText = isReal ? "Verified" : "Security Alert";
  document.getElementById('popMsg').innerHTML = isReal ? `Verified payment of ₹${amount} from ${party}.` : `Verification failed. Pattern mismatch detected.`;
}
</script>
</body>
</html>
