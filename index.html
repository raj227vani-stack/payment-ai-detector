<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay AI | Final Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f4f7f9; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .camera-box { width: 100%; height: 300px; background: #000; border-radius: 15px; overflow: hidden; position: relative; border: 3px solid #4F46E5; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #4F46E5; box-shadow: 0 0 15px #4F46E5; animation: scan 2s infinite linear; display:none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .btn { background: #4F46E5; color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; margin-top: 15px; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; border-radius: 12px; font-weight: bold; display: none; }
        .real { background: #d1fae5; color: #065f46; }
        .fake { background: #fee2e2; color: #991b1b; }
        .loader { font-size: 12px; color: #666; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:#4F46E5">SafePay AI 🛡️</h2>
    <div class="camera-box">
        <div id="scannerLine" class="scanner-line"></div>
        <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <button id="startBtn" class="btn" onclick="openCam()">1. Start Camera</button>
    <button id="scanBtn" class="btn" onclick="analyze()" style="display:none; background:#10b981;">2. Scan & Verify</button>
    
    <div id="loader" class="loader">AI Analyzing Transaction Details...</div>
    <div id="result"></div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const resultDiv = document.getElementById('result');
    const loader = document.getElementById('loader');
    const line = document.getElementById('scannerLine');

    function speak(t) { window.speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }

    async function openCam() {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = s;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('scanBtn').style.display = 'block';
    }

    async function analyze() {
        loader.style.display = 'block';
        line.style.display = 'block';
        resultDiv.style.display = 'none';
        
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // OCR Processing
        const img = canvas.toDataURL('image/png');
        Tesseract.recognize(img, 'eng').then(({ data: { text } }) => {
            const val = text.toLowerCase();
            console.log("Detected:", val);

            // PhonePe/GPay specific keywords
            const isReal = val.includes('utr') || val.includes('transaction') || val.includes('successful') || val.includes('paid to') || val.includes('debited');

            loader.style.display = 'none';
            line.style.display = 'none';
            resultDiv.style.display = 'block';

            if(isReal) {
                resultDiv.innerHTML = "✅ REAL PAYMENT<br><small>UTR/Transaction ID Detected</small>";
                resultDiv.className = "real";
                speak("Verified. Real Payment.");
            } else {
                resultDiv.innerHTML = "⚠️ FAKE / INVALID<br><small>No Transaction Data Found</small>";
                resultDiv.className = "fake";
                speak("Warning. Fake Payment.");
            }
        });
    }
</script>
</body>
</html>
