<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay AI | Secure Verification</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root { --primary: #00ff88; --dark-bg: #05070a; --card-bg: #111827; }
        body { 
            margin: 0; background: var(--dark-bg); color: #e5e7eb; 
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .app-container {
            width: 420px; background: var(--card-bg); border-radius: 30px;
            padding: 30px; box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(0, 255, 136, 0.1); text-align: center;
        }
        .header h1 { margin: 0; font-size: 28px; color: var(--primary); letter-spacing: -1px; }
        .header p { font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-bottom: 20px; }

        .display-box {
            width: 100%; height: 350px; background: #000; border-radius: 20px;
            position: relative; overflow: hidden; border: 2px solid #1f2937;
        }
        video, #imgView { width: 100%; height: 100%; object-fit: cover; display: none; }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .btn {
            padding: 16px; border-radius: 14px; border: none; font-weight: 800;
            cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .btn-live { background: var(--primary); color: #000; }
        .btn-up { background: #1f2937; color: #fff; border: 1px solid #374151; }
        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        .status-panel {
            margin-top: 20px; padding: 20px; border-radius: 18px;
            display: none; background: rgba(0,0,0,0.3); border: 1px solid #374151;
        }
        .verdict { font-size: 20px; font-weight: 900; margin-bottom: 5px; }
        
        .details-table {
            width: 100%; margin-top: 15px; font-size: 12px; border-top: 1px solid #374151;
            padding-top: 10px; text-align: left; display: none;
        }
        .row { display: flex; justify-content: space-between; padding: 4px 0; }
        .val { color: var(--primary); font-weight: 600; }

        .voice-opt { margin-top: 15px; font-size: 12px; color: #6b7280; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>SafePay AI</h1>
        <p>Advanced Fraud Detection Engine</p>
    </div>

    <div class="display-box">
        <video id="videoFeed" autoplay playsinline></video>
        <img id="imgView" src="">
        <div id="msg" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#4b5563;">System Standby...</div>
    </div>

    <div class="controls">
        <button class="btn btn-live" onclick="initLive()">LIVE SCAN</button>
        <button class="btn btn-up" onclick="document.getElementById('inputRef').click()">UPLOAD</button>
        <input type="file" id="inputRef" hidden accept="image/*" onchange="initUpload(event)">
    </div>

    <div id="statusPanel" class="status-panel">
        <div id="verdict" class="verdict">ANALYZING...</div>
        <div id="accuracy" style="font-size: 12px; color: #9ca3af;">Accuracy: 0%</div>
        
        <div class="details-table" id="details">
            <div class="row"><span>Amount:</span> <span class="val" id="det-amt">--</span></div>
            <div class="row"><span>Ref No:</span> <span class="val" id="det-id">--</span></div>
            <div class="row"><span>App:</span> <span class="val" id="det-app">--</span></div>
        </div>
    </div>

    <div class="voice-opt">
        <input type="checkbox" id="voiceToggle" checked> VOICE ASSISTANT ACTIVE
    </div>
</div>

<canvas id="calcCanvas" style="display:none;"></canvas>

<script>
    const MODEL_PATH = "https://teachablemachine.withgoogle.com/models/i583iDC7K/";
    let model;

    // Load AI Model immediately
    (async () => {
        model = await tmImage.load(MODEL_PATH + "model.json", MODEL_PATH + "metadata.json");
        document.getElementById('msg').innerText = "AI Loaded & Ready";
    })();

    async function initLive() {
        const video = document.getElementById('videoFeed');
        document.getElementById('msg').style.display = "none";
        video.style.display = "block";
        document.getElementById('imgView').style.display = "none";

        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;

        setInterval(() => { if (video.srcObject) processFrame(video); }, 3000);
    }

    async function initUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const img = document.getElementById('imgView');
        document.getElementById('msg').style.display = "none";
        img.style.display = "block";
        document.getElementById('videoFeed').style.display = "none";

        const reader = new FileReader();
        reader.onload = (f) => {
            img.src = f.target.result;
            img.onload = () => processFrame(img);
        };
        reader.readAsDataURL(file);
    }

    async function processFrame(source) {
        const canvas = document.getElementById('calcCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = source.videoWidth || source.naturalWidth;
        canvas.height = source.videoHeight || source.naturalHeight;
        ctx.drawImage(source, 0, 0);

        // OCR Verification Layer
        const ocr = await Tesseract.recognize(canvas, 'eng');
        const text = ocr.data.text.toLowerCase();
        
        // Only proceed if it looks like a receipt
        if (/paid|successful|utr|upi|transaction|amount/i.test(text)) {
            const predictions = await model.predict(source);
            const best = predictions.sort((a,b) => b.probability - a.probability)[0];
            renderUI(best, text);
        }
    }

    function renderUI(best, fullText) {
        const panel = document.getElementById('statusPanel');
        const details = document.getElementById('details');
        const verdict = document.getElementById('verdict');
        
        panel.style.display = "block";
        details.style.display = "block";
        
        const isReal = best.className.toLowerCase().includes("real");
        verdict.innerText = isReal ? "AUTHENTIC" : "FRAUD DETECTED";
        verdict.style.color = isReal ? "#00ff88" : "#ff4444";
        panel.style.borderColor = isReal ? "#00ff88" : "#ff4444";

        document.getElementById('accuracy').innerText = `AI Accuracy: ${(best.probability * 100).toFixed(1)}%`;
        document.getElementById('det-amt').innerText = (fullText.match(/[₹rs]\s?\d+/i) || ["--"])[0].toUpperCase();
        document.getElementById('det-id').innerText = (fullText.match(/\d{10,12}/) || ["--"])[0];
        document.getElementById('det-app').innerText = fullText.includes('phonepe') ? "PhonePe" : (fullText.includes('gpay') ? "GPay" : "UPI App");

        if (document.getElementById('voiceToggle').checked) {
            const speech = new SpeechSynthesisUtterance(isReal ? "Verified" : "Fraud Alert");
            window.speechSynthesis.speak(speech);
        }
    }
</script>
</body>
</html>
