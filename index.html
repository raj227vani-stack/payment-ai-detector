<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuthentiPay AI - Ultra Protection</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
body{
  margin:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  display:flex; justify-content:center; align-items:center; height:100vh;
  position: relative; color: #333;
}
.container{
  width:420px; background:white; border-radius:24px; padding:25px;
  box-shadow:0 25px 50px rgba(0,0,0,0.3); text-align:center;
}
#soundToggle {
  position: absolute; top: 20px; right: 20px;
  background: white; border-radius: 50%; width: 50px; height: 50px;
  display: flex; justify-content: center; align-items: center;
  cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  font-size: 22px; border: none; z-index: 100; transition: 0.3s;
}
#soundToggle:active { transform: scale(0.9); }
img{width:100%; border-radius:15px; margin-top:15px; max-height: 250px; object-fit: contain; border: 1px solid #ddd;}
.result{margin-top:15px; padding:15px; border-radius:12px; font-weight:bold; font-size: 18px;}
.real{background:#dcfce7; color:#15803d; border: 1px solid #bbf7d0;}
.fake{background:#fee2e2; color:#b91c1c; border: 1px solid #fecaca;}
.info-section{font-size:14px; color:#475569; margin-top:10px; text-align: left; padding: 10px; background: #f8fafc; border-radius: 10px;}
button, input[type="file"]{margin-top:15px; padding:12px; border-radius:10px; border: 1px solid #cbd5e1; width: 100%; font-weight: 600;}
#resetBtn { background: #0f172a; color: white; border: none; display: none; }
hr { border: 0; border-top: 1px solid #e2e8f0; margin: 10px 0; }
</style>
</head>
<body>

<button id="soundToggle" title="Sound On/Off">🔊</button>

<div class="container">
  <h2 style="margin-top:0; color:#0f172a;">AuthentiPay AI</h2>
  
  <input type="file" id="upload" accept="image/*">
  <img id="preview" style="display:none;">
  
  <div id="status" style="margin-top:10px; font-size: 13px; color: #64748b;">Ready to Scan</div>
  
  <div id="result" class="result">Waiting for Image...</div>
  
  <div id="details" class="info-section"></div>
  
  <button id="resetBtn">Scan Another Receipt</button>
</div>

<script>
const preview=document.getElementById("preview");
const resultDiv=document.getElementById("result");
const statusText=document.getElementById("status");
const details=document.getElementById("details");
const resetBtn=document.getElementById("resetBtn");
const soundToggle = document.getElementById("soundToggle");
const uploadInput = document.getElementById("upload");

let isSoundOn = true;

soundToggle.onclick = () => {
  isSoundOn = !isSoundOn;
  soundToggle.innerText = isSoundOn ? "🔊" : "🔈";
  soundToggle.style.background = isSoundOn ? "white" : "#e2e8f0";
};

function speak(text) {
  if (isSoundOn && 'speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const speech = new SpeechSynthesisUtterance(text);
    speech.rate = 0.9;
    speech.pitch = 1;
    window.speechSynthesis.speak(speech);
  }
}

uploadInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if(!file) return;
  
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  uploadInput.style.display = "none";
  
  preview.onload = () => { startOCR(); };
});

resetBtn.onclick = () => {
  window.speechSynthesis.cancel();
  location.reload(); // Best way to clear all memory/cache for fresh scan
};

async function startOCR(){
  statusText.innerText = "Analyzing Security Patterns...";
  try {
    const { data:{ text } } = await Tesseract.recognize(preview, 'eng');
    analyze(text);
  } catch (err) {
    statusText.innerText = "Error scanning image.";
  }
}

function analyze(text){
  const t = text.toLowerCase();
  
  // 1. ADVANCED AMOUNT EXTRACTION (Fixes 5500/550 issue)
  let amountValue = "Not Found";
  // Regex looks for digits with optional commas and decimals after currency markers
  let amountMatch = text.match(/(?:₹|Rs\.?|INR|Amount|Amt|Total)\s*([\d,]{1,10}(?:\.\d{2})?)/i);
  
  if (amountMatch) {
    amountValue = amountMatch[1].replace(/,/g, ''); 
  } else {
    // Fallback: Find the most prominent numerical figure (usually the amount)
    let numbers = text.match(/\d{1,3}(?:,\d{3})*(?:\.\d{2})/g) || text.match(/\d{3,10}/g);
    if (numbers) {
      amountValue = numbers.sort((a,b) => parseFloat(b.replace(/,/g,'')) - parseFloat(a.replace(/,/g,'')))[0];
    }
  }

  // 2. UPI ID & NAME DETECTION
  let upiMatch = text.match(/[a-zA-Z0-9.\-_]+@[a-zA-Z0-9.\-_]+/);
  let upiID = upiMatch ? upiMatch[0] : "Not Detected";

  let nameMatch = text.match(/(?:Paid to|To|Transfer to|From|Received from|Beneficiary|Receiver)\s*:?\s*([A-Z\s]{3,25})/i);
  let personName = nameMatch ? nameMatch[1].trim() : "Unknown";

  // 3. TRANSACTION DIRECTION
  let isReceived = t.includes("received") || t.includes("credited") || t.includes("from");
  let direction = isReceived ? "Received from" : "Paid to";

  // 4. AUTHENTICITY SCORE
  let score = 0;
  if(upiID !== "Not Detected") score += 2;
  if(amountValue !== "Not Found") score += 2;
  if(t.includes("success") || t.includes("completed") || t.includes("paid")) score += 2;
  if(/\d{12}/.test(t)) score += 2; // Ref/Transaction ID check

  let isVerified = score >= 4;
  let trustPercent = Math.min(Math.round((score/8)*100), 100);

  // UI DISPLAY
  resultDiv.className = "result " + (isVerified ? "real" : "fake");
  resultDiv.innerHTML = isVerified ? `🟢 VERIFIED (${trustPercent}%)` : `🔴 SUSPICIOUS (${trustPercent}%)`;

  details.innerHTML = `
    <strong>Status:</strong> ${isVerified ? 'Authentic' : 'Risk Detected'}<br>
    <strong>${direction}:</strong> ${personName}<br>
    <strong>Amount:</strong> ₹${amountValue}<br>
    <strong>UPI ID:</strong> ${upiID}
    <hr>
    <small>Security Check: OCR Parsing Complete.</small>
  `;

  // VOICE OUTPUT
  let voiceMsg = isVerified ? "Receipt verified." : "Warning, suspicious receipt.";
  voiceMsg += ` ${direction} ${personName}. Amount is ${amountValue} rupees.`;
  speak(voiceMsg);

  statusText.innerText = "Scan Complete";
  resetBtn.style.display = "block";
}
</script>
</body>
</html>
