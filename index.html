<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay AI | Neural Integrity System</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root {
            --cyan: #00f2ff;
            --emerald: #10b981;
            --crimson: #ff4b2b;
            --panel: rgba(10, 15, 25, 0.9);
        }

        body {
            margin: 0;
            background: #010409;
            font-family: 'Space Grotesk', sans-serif;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Abstract Background Grid */
        body::before {
            content: "";
            position: absolute;
            width: 200%; height: 200%;
            background-image: linear-gradient(rgba(0, 242, 255, 0.05) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            transform: perspective(500px) rotateX(60deg);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 1000px; } }

        .terminal-shell {
            width: 400px;
            background: var(--panel);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), 0 0 20px rgba(0, 242, 255, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header h2 { margin: 0; font-size: 22px; font-weight: 800; color: var(--cyan); text-transform: uppercase; letter-spacing: 2px; }

        .camera-viewport {
            width: 100%;
            height: 320px;
            background: #000;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid #161b22;
        }

        video { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.1) brightness(0.9); }

        /* Neural Pulse Circle */
        .pulse-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150px; height: 150px;
            border: 1px solid var(--cyan);
            border-radius: 50%;
            opacity: 0.5;
            animation: pulse-ring 2s infinite ease-out;
            pointer-events: none;
        }

        @keyframes pulse-ring { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

        .log-stream {
            margin-top: 15px;
            height: 50px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #8b949e;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            border-left: 3px solid var(--cyan);
        }

        .result-hud {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            display: none;
            font-weight: bold;
            letter-spacing: 1px;
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .btn-launch {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: var(--cyan);
            color: #010409;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-launch:hover { box-shadow: 0 0 20px var(--cyan); transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="terminal-shell">
    <div class="header">
        <h2>SafePay AI</h2>
        <span style="font-size: 10px; opacity: 0.5;">ENGINE: v4.0 PRO</span>
    </div>

    <div class="camera-viewport">
        <video id="video" autoplay playsinline></video>
        <div class="pulse-overlay"></div>
    </div>

    <div class="log-stream" id="log">
        [SYS] Awaiting bio-sensory handshake...
    </div>

    <div id="resultBox" class="result-hud"></div>

    <button class="btn-launch" id="btn" onclick="startSystem()">INITIALIZE CORE</button>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    let model;
    const log = document.getElementById('log');
    const resultBox = document.getElementById('resultBox');

    function updateLog(msg) {
        log.innerHTML = `[AI] ${msg}<br>[SYS] kernel_processing...`;
    }

    async function startSystem() {
        document.getElementById('btn').style.display = 'none';
        updateLog("Loading Neural Weights...");
        
        try {
            model = await mobilenet.load();
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('video').srcObject = stream;
            updateLog("Optical Feed Secured. Targeting UPI Layouts.");
            analyze();
        } catch(e) {
            updateLog("CRITICAL ERROR: SENSORS BLOCKED.");
        }
    }

    async function analyze() {
        setInterval(async () => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);

            updateLog("Scanning Integrity Hashes...");

            // Logic: OCR + Pattern Confidence
            Tesseract.recognize(canvas, 'eng').then(({ data: { text } }) => {
                const terms = ['paid', 'success', 'utr', 'transaction', 'upi'];
                const matchCount = terms.filter(t => text.toLowerCase().includes(t)).length;
                
                showVerdict(matchCount);
            });
        }, 4000);
    }

    function showVerdict(matches) {
        resultBox.style.display = "block";
        
        // Dynamic Grading System
        if (matches >= 2) {
            resultBox.style.background = "rgba(16, 185, 129, 0.2)";
            resultBox.style.border = "1px solid var(--emerald)";
            resultBox.style.color = var(--emerald);
            resultBox.innerHTML = "VERDICT: AUTHENTIC RECEIPT";
            updateLog("Integrity verified. Trust index: HIGH.");
        } else {
            resultBox.style.background = "rgba(255, 75, 43, 0.2)";
            resultBox.style.border = "1px solid var(--crimson)";
            resultBox.style.color = var(--crimson);
            resultBox.innerHTML = "VERDICT: SUSPICIOUS ANOMALY";
            updateLog("THREAT DETECTED. Pattern mismatch.");
        }
    }
</script>

</body>
</html>
