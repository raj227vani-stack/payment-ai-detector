<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AuthentiPay AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<style>
body{
    font-family:system-ui;
    text-align:center;
    background:#f1f5f9;
}

video{
    width:300px;
    margin-top:20px;
    border-radius:10px;
}

.result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.status{
    font-size:13px;
    color:gray;
}
</style>
</head>

<body>

<h2>AuthentiPay AI</h2>

<video id="video" autoplay></video>

<div class="status">Stabilizing AI detection...</div>
<div class="result" id="result">Loading...</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let model;
let video=document.getElementById('video');
let result=document.getElementById('result');
let canvas=document.getElementById('canvas');

// 🔥 Stability buffer
let buffer=[];

async function init(){
    model=await mobilenet.load();

    const stream=await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject=stream;

    scan();
}
init();

function scan(){
    setInterval(async ()=>{

        if(video.readyState!==4) return;

        const ctx=canvas.getContext('2d');
        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;
        ctx.drawImage(video,0,0);

        const predictions=await model.classify(canvas);
        let prob=predictions[0].probability;

        // 🧠 Store last 5 results
        buffer.push(prob);
        if(buffer.length>5){
            buffer.shift();
        }

        // 📊 Average calculation
        let avg=buffer.reduce((a,b)=>a+b,0)/buffer.length;

        updateResult(avg);

    },1200); // fast + stable
}

function updateResult(prob){

    let confidence=Math.round(prob*100);

    if(prob>0.6){
        result.innerText=`🟢 VERIFIED (${confidence}%)`;
    }else{
        result.innerText=`🔴 SUSPICIOUS (${confidence}%)`;
    }
}
</script>

</body>
</html>
