<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafePay AI Pro</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js"></script>

<style>
body {
    font-family: system-ui;
    background: linear-gradient(135deg,#eef2ff,#f8fafc);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container {
    width: 420px;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 20px 50px rgba(0,0,0,0.1);
    text-align:center;
}

.camera {
    height:300px;
    background:black;
    border-radius:20px;
    overflow:hidden;
}

video {width:100%;height:100%;object-fit:cover;}

button {
    margin-top:20px;
    padding:15px;
    width:100%;
    border:none;
    border-radius:15px;
    background:black;
    color:white;
}

.result {margin-top:20px;padding:15px;border-radius:15px;display:none;}
.real {background:#dcfce7;color:#166534;}
.fake {background:#fee2e2;color:#991b1b;}

.loader {display:none;margin-top:10px;color:blue;}
</style>
</head>

<body>

<div class="container">
<h2>SafePay AI Pro</h2>

<div class="camera">
<video id="video" autoplay></video>
</div>

<button onclick="scan()">Scan Receipt</button>

<div id="loader" class="loader">Analyzing AI + Patterns...</div>
<div id="result" class="result"></div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let model;
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let resultDiv = document.getElementById('result');
let loader = document.getElementById('loader');

async function loadModel(){
    model = await mobilenet.load();
}
loadModel();

async function startCamera(){
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
}
startCamera();

async function scan(){

    loader.style.display='block';
    resultDiv.style.display='none';

    const ctx = canvas.getContext('2d');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video,0,0);

    // 🔥 AI Prediction
    const predictions = await model.classify(canvas);
    let aiProb = predictions[0].probability;

    // 🔥 OCR TEXT
    const { data: { text } } = await Tesseract.recognize(canvas, 'eng');

    // 🔥 Pattern Score
    let patternScore = 0;

    if(text.includes("@")) patternScore += 1;
    if(/\d{12}/.test(text)) patternScore += 1;
    if(text.toLowerCase().includes("upi")) patternScore += 1;
    if(text.toLowerCase().includes("paid")) patternScore += 1;

    // 🔥 Final Score
    let finalScore = (aiProb * 0.6) + (patternScore * 0.1);

    setTimeout(()=>{

        loader.style.display='none';
        resultDiv.style.display='block';

        let confidence = Math.min(95, Math.round(finalScore * 100));

        if(finalScore > 0.5){
            resultDiv.className="result real";
            resultDiv.innerHTML = `
                <h3>🟢 REAL PAYMENT</h3>
                Confidence: ${confidence}%<br>
                Valid UPI + Transaction patterns detected
            `;
            speak(`This payment appears genuine with ${confidence} percent confidence`);
        } else {
            resultDiv.className="result fake";
            resultDiv.innerHTML = `
                <h3>🔴 FAKE PAYMENT</h3>
                Confidence: ${confidence}%<br>
                Suspicious or missing transaction details
            `;
            speak(`This payment appears to be fake with ${confidence} percent confidence`);
        }

    },1500);
}

function speak(text){
    speechSynthesis.cancel();
    speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}
</script>

</body>
</html>
