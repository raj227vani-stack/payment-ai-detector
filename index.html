<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #2563eb);
    color: white;
}

header {
    text-align: center;
    padding: 20px;
    font-size: 26px;
    font-weight: bold;
}

.container {
    display: flex;
    height: 90vh;
}

.left, .right {
    width: 50%;
    padding: 40px;
}

.left {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.upload-box {
    border: 2px dashed white;
    padding: 50px;
    border-radius: 20px;
    cursor: pointer;
    text-align: center;
    transition: 0.3s;
}

.upload-box:hover {
    background: rgba(255,255,255,0.1);
}

input {
    display: none;
}

button {
    margin-top: 25px;
    padding: 14px 30px;
    background: white;
    color: #1e3a8a;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #dbeafe;
}

img {
    max-width: 320px;
    margin-top: 20px;
    border-radius: 12px;
}

.right {
    background: white;
    color: black;
    border-radius: 30px 0 0 30px;
}

.result-box {
    margin-top: 20px;
    padding: 25px;
    background: #f1f5f9;
    border-radius: 12px;
}

.loader {
    border: 5px solid #eee;
    border-top: 5px solid #2563eb;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin-top: 20px;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<header>🚀 AI Image Scanner</header>

<div class="container">

<div class="left">
    <label class="upload-box">
        📂 Click to Upload Image
        <input type="file" id="fileInput" accept="image/*">
    </label>

    <img id="preview" />

    <button onclick="predict()">Scan Image</button>
</div>

<div class="right">
    <h2>Scan Results</h2>
    <div id="result" class="result-box">No result yet...</div>
</div>

</div>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/i583iDC7K/";

let model;

async function loadModel() {
    const modelURL = URL + "model.json";
    const metadataURL = URL + "metadata.json";
    model = await tmImage.load(modelURL, metadataURL);
}
loadModel(); // load model automatically

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");

fileInput.addEventListener("change", function() {
    const file = fileInput.files[0];
    if (file) {
        preview.src = URL.createObjectURL(file);
    }
});

async function predict() {
    if (!model) {
        alert("Model loading, please wait...");
        return;
    }

    const resultBox = document.getElementById("result");
    resultBox.innerHTML = "<div class='loader'></div><p>Scanning...</p>";

    const prediction = await model.predict(preview);

    let best = prediction.reduce((a, b) => a.probability > b.probability ? a : b);

    resultBox.innerHTML = `
        <h3>Prediction: ${best.className}</h3>
        <p>Confidence: ${(best.probability * 100).toFixed(2)}%</p>
    `;
}
</script>

</body>
</html>
