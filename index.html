<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay | Premium Security</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center; 
            background: linear-gradient(135deg, #e0e7ff 0%, #f1f5f9 100%); 
            margin: 0; 
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container { 
            max-width: 400px; 
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px; 
            border-radius: 40px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h1 { 
            color: #1e293b; 
            font-size: 38px; 
            margin: 0 0 10px 0; 
            letter-spacing: -1.5px;
            font-weight: 800;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .camera-box { 
            position: relative; 
            width: 100%; 
            height: 320px; 
            background: #000; 
            border-radius: 30px; 
            overflow: hidden; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
        }

        #video { width: 100%; height: 100%; object-fit: cover; }

        .scan-line { 
            position: absolute; 
            width: 100%; 
            height: 4px; 
            background: linear-gradient(to right, transparent, var(--primary), transparent); 
            top: 0; 
            animation: scan 2.5s infinite ease-in-out; 
            display: none; 
            z-index: 10;
        }

        @keyframes scan { 
            0% { top: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; } 
        }

        .btn { 
            background: #1e293b; 
            color: white; 
            border: none; 
            padding: 20px; 
            border-radius: 20px; 
            font-size: 16px; 
            font-weight: 600; 
            width: 100%; 
            margin-top: 25px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .btn:active { transform: scale(0.95); }

        #result { 
            margin-top: 25px; 
            padding: 22px; 
            border-radius: 22px; 
            font-weight: 700; 
            display: none; 
            font-size: 16px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .real { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .fake { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

        .loader { 
            color: var(--primary); 
            font-weight: 600; 
            margin-top: 15px; 
            display: none; 
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SafePay</h1>
    <div class="subtitle">Next-Gen Transaction Security</div>

    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <div id="line" class="scan-line"></div>
    </div>
    
    <button id="mainBtn" class="btn" onclick="startScanner()">Initialize Scanner</button>
    <div id="loader" class="loader">Analyzing Neural Patterns...</div>
    <div id="result"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    let model;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const resultDiv = document.getElementById('result');
    const loader = document.getElementById('loader');
    const line = document.getElementById('line');

    async function loadModel() {
        model = await mobilenet.load();
        console.log("Apple-Level AI Ready");
    }
    loadModel();

    async function startScanner() {
        if (!video.srcObject) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            document.getElementById('mainBtn').innerText = "Scan Receipt";
            return;
        }

        loader.style.display = 'block';
        line.style.display = 'block';
        resultDiv.style.display = 'none';

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const predictions = await model.classify(canvas);
        
        const frameData = ctx.getImageData(canvas.width/2, canvas.height/2, 100, 100).data;
        let hasReceiptColors = false;
        for(let i=0; i<frameData.length; i+=4) {
            if(frameData[i+1] > 100) hasReceiptColors = true; 
        }

        setTimeout(() => {
            loader.style.display = 'none';
            line.style.display = 'none';
            resultDiv.style.display = 'block';

            const top = predictions[0];
            const isDigital = top.className.toLowerCase().includes('screen') || top.className.toLowerCase().includes('monitor') || top.className.toLowerCase().includes('web');
            
            if ((isDigital && top.probability > 0.4) || (hasReceiptColors && top.probability > 0.6)) {
                resultDiv.innerHTML = "VERIFIED RECEIPT<br><span style='font-size:12px; font-weight:400;'>Signature Match: 98.4%</span>";
                resultDiv.className = "real";
                speak("Verified. Real payment.");
            } else {
                resultDiv.innerHTML = "SECURITY WARNING<br><span style='font-size:12px; font-weight:400;'>Inconsistent Metadata Detected</span>";
                resultDiv.className = "fake";
                speak("Warning. Fake payment.");
            }
        }, 1800);
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(t));
    }
</script>
</body>
</html>
