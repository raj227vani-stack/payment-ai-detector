<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SafePay AI | Secure Neural Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        :root { --p: #00ff88; --r: #ff4444; --b: #05070a; }
        body { margin: 0; background: var(--b); color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { width: 420px; background: #111827; padding: 25px; border-radius: 28px; border: 1px solid rgba(0,255,136,0.1); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .view-screen { width: 100%; height: 350px; background: #000; border-radius: 20px; margin: 20px 0; overflow: hidden; position: relative; border: 2px solid #1f2937; }
        video, img { width: 100%; height: 100%; object-fit: contain; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { padding: 16px; border-radius: 14px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-p { background: var(--p); color: #000; }
        .btn-s { background: #374151; color: #fff; }
        .btn:active { transform: scale(0.95); }
        #res-box { margin-top: 20px; padding: 20px; border-radius: 18px; display: none; background: rgba(0,0,0,0.4); border: 1px solid #1f2937; }
        #v-text { font-size: 24px; font-weight: 900; margin-bottom: 5px; }
        .meta { text-align: left; font-size: 13px; margin-top: 12px; border-top: 1px solid #1f2937; padding-top: 10px; color: #9ca3af; }
        .val { color: white; font-weight: 600; float: right; }
    </style>
</head>
<body>

<div class="card">
    <div style="text-align: left;">
        <h1 style="color:var(--p); margin:0; font-size: 24px;">SafePay AI</h1>
        <p style="font-size:10px; color:#4b5563; text-transform: uppercase;">Final Deployment Version 4.0</p>
    </div>

    <div class="view-screen">
        <video id="vid" autoplay playsinline style="display:none;"></video>
        <img id="u-img" style="display:none;">
        <div id="ld" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#1f2937; font-weight: bold;">LOADING AI CORE...</div>
    </div>

    <div class="btn-group">
        <button class="btn btn-p" onclick="openCam()">Live Scan</button>
        <button class="btn btn-s" onclick="document.getElementById('f-up').click()">Upload</button>
        <input type="file" id="f-up" hidden accept="image/*" onchange="autoScanFile(event)">
    </div>

    <div id="res-box">
        <div id="v-text">--</div>
        <div id="conf" style="font-size:11px; color:#9ca3af;">Accuracy: 0%</div>
        <div class="meta">
            <div>Amount: <span class="val" id="d-amt">--</span></div>
            <div style="margin-top:5px;">Ref ID: <span class="val" id="d-id">--</span></div>
        </div>
    </div>
</div>

<canvas id="proc" style="display:none;"></canvas>

<script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/i583iDC7K/";
    let aiModel;

    // Load Model on Page Load
    (async () => {
        try {
            aiModel = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
            document.getElementById('ld').innerText = "AI ONLINE";
        } catch(e) { document.getElementById('ld').innerText = "ERROR LOADING MODEL"; }
    })();

    // 1. Live Scan Logic
    async function openCam() {
        const v = document.getElementById('vid');
        const img = document.getElementById('u-img');
        v.style.display="block"; img.style.display="none";
        document.getElementById('ld').style.display="none";

        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
            v.srcObject = stream;
            // Scan loop every 3 seconds for Live Mode
            setInterval(() => { if(v.srcObject) engine(v); }, 3000);
        } catch(e) { alert("Camera Permission Required!"); }
    }

    // 2. **Auto Scan on Upload**
    function autoScanFile(e) {
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        const img = document.getElementById('u-img');
        const v = document.getElementById('vid');
        img.style.display="block"; v.style.display="none";
        document.getElementById('ld').style.display="none";

        reader.onload = (f) => {
            img.src = f.target.result;
            // Jaise hi image load ho, bina button dabaye scan trigger kar do
            img.onload = () => engine(img);
        };
        reader.readAsDataURL(file);
    }

    // 3. **The Core Engine**
    async function engine(source) {
        if(!aiModel) return;

        // Visual Prediction (Teachable Machine)
        const pred = await aiModel.predict(source);
        const top = pred.sort((a,b) => b.probability - a.probability)[0];

        // OCR Processing (For details only)
        const can = document.getElementById('proc');
        can.width = source.videoWidth || source.naturalWidth;
        can.height = source.videoHeight || source.naturalHeight;
        can.getContext('2d').drawImage(source, 0, 0);
        
        const ocr = await Tesseract.recognize(can, 'eng');
        const text = ocr.data.text.toLowerCase();

        updateUI(top, text);
    }

    function updateUI(top, text) {
        const box = document.getElementById('res-box');
        const verdict = document.getElementById('v-text');
        box.style.display = "block";

        const isReal = top.className.toLowerCase().includes("real");
        const accuracy = (top.probability * 100).toFixed(1);

        verdict.innerText = isReal ? "AUTHENTIC" : "FRAUD DETECTED";
        verdict.style.color = isReal ? "var(--p)" : "var(--r)";
        box.style.borderColor = isReal ? "var(--p)" : "var(--r)";
        
        document.getElementById('conf').innerText = `Neural Confidence: ${accuracy}%`;
        document.getElementById('d-amt').innerText = (text.match(/[₹rs]\s?\d+/i) || ["N/A"])[0].toUpperCase();
        document.getElementById('d-id').innerText = (text.match(/\d{10,12}/) || ["N/A"])[0];

        // Voice Feedback
        const speech = new SpeechSynthesisUtterance(isReal ? "Verified" : "Warning: Fraud Detected");
        window.speechSynthesis.speak(speech);
    }
</script>
</body>
</html>
