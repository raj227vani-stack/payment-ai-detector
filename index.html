<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay AI | Fraud Detection</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

    <style>
        :root { --p: #00f2ff; --b: #0a0c10; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; background: var(--b); font-family: 'Inter', sans-serif; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 90%; max-width: 450px; background: var(--glass); backdrop-filter: blur(20px); border-radius: 30px; padding: 25px; border: 1px solid rgba(0, 242, 255, 0.1); box-shadow: 0 0 40px rgba(0,0,0,0.5); }
        .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 22px; margin: 0; color: var(--p); text-transform: uppercase; letter-spacing: 1px; }

        .view-port { width: 100%; height: 300px; background: #000; border-radius: 20px; overflow: hidden; position: relative; border: 1px solid #1e293b; }
        video, #previewImg { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 13px; }
        .btn-p { background: var(--p); color: black; }
        .btn-s { background: #1e293b; color: white; border: 1px solid #334155; }

        .result-hud { margin-top: 20px; padding: 15px; border-radius: 15px; display: none; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .data-grid { margin-top: 15px; display: none; width: 100%; border-collapse: collapse; font-size: 11px; }
        .data-grid td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #94a3b8; }
        .val { text-align: right; color: white; font-weight: bold; }

        /* Voice Toggle */
        .toggle-box { display: flex; align-items: center; gap: 8px; font-size: 10px; color: #64748b; }
        input[type="checkbox"] { accent-color: var(--p); }
    </style>
</head>
<body>

<div class="container">
    <div class="head">
        <h1>SafePay AI</h1>
        <div class="toggle-box">
            <span>SOUND</span>
            <input type="checkbox" id="voiceToggle" checked>
        </div>
    </div>

    <div class="view-port">
        <video id="webcam" autoplay playsinline></video>
        <img id="previewImg" src="">
        <div id="loader" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:12px; color:#64748b;">Ready to analyze...</div>
    </div>

    <div class="btn-group">
        <button class="btn btn-p" onclick="startCamera()">SCAN RECEIPT</button>
        <button class="btn btn-s" onclick="document.getElementById('fileIn').click()">UPLOAD PHOTO</button>
        <input type="file" id="fileIn" hidden accept="image/*" onchange="handleUpload(event)">
    </div>

    <div id="resultHud" class="result-hud">
        <div id="verdict" style="font-size: 16px; margin-bottom: 5px;"></div>
        <div style="font-size: 10px; color: #64748b;">Confidence Accuracy: <span id="confLabel">0%</span></div>
    </div>

    <table class="data-grid" id="dataTable">
        <tr><td>Recipient Name:</td><td class="val" id="d-name">--</td></tr>
        <tr><td>UPI ID:</td><td class="val" id="d-upi">--</td></tr>
        <tr><td>Amount:</td><td class="val" id="d-amt">--</td></tr>
        <tr><td>UTR / Transaction:</td><td class="val" id="d-utr">--</td></tr>
    </table>
</div>

<canvas id="procCanvas" style="display:none;"></canvas>

<script>
    const URL = "https://teachablemachine.withgoogle.com/models/i583iDC7K/";
    let model, webcam;

    async function startCamera() {
        document.getElementById('loader').innerText = "Starting Camera...";
        const video = document.getElementById('webcam');
        video.style.display = "block";
        document.getElementById('previewImg').style.display = "none";
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            if(!model) model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            analyzeLive();
        } catch(e) { alert("Camera access denied."); }
    }

    function handleUpload(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        const img = document.getElementById('previewImg');
        img.style.display = "block";
        document.getElementById('webcam').style.display = "none";
        
        reader.onload = async (f) => {
            img.src = f.target.result;
            if(!model) model = await tmImage.load(URL + "model.json", URL + "metadata.json");
            analyzeStatic(img);
        };
        reader.readAsDataURL(file);
    }

    async function analyzeLive() {
        setInterval(async () => {
            const video = document.getElementById('webcam');
            if(video.srcObject) {
                const prediction = await model.predict(video);
                processResults(prediction, video);
            }
        }, 3000);
    }

    async function analyzeStatic(imgElement) {
        const prediction = await model.predict(imgElement);
        processResults(prediction, imgElement);
    }

    async function processResults(predictions, source) {
        const canvas = document.getElementById('procCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = source.videoWidth || source.naturalWidth;
        canvas.height = source.videoHeight || source.naturalHeight;
        ctx.drawImage(source, 0, 0);

        Tesseract.recognize(canvas, 'eng').then(({ data: { text } }) => {
            const raw = text.toLowerCase();
            const isReceipt = raw.includes('paid') || raw.includes('successful') || raw.includes('utr') || raw.includes('transaction');

            if(isReceipt) {
                const best = predictions.sort((a,b) => b.probability - a.probability)[0];
                const accuracy = (best.probability * 100).toFixed(1);
                
                // Show Result
                document.getElementById('resultHud').style.display = "block";
                document.getElementById('verdict').innerText = best.className.toUpperCase();
                document.getElementById('verdict').style.color = best.className.toLowerCase().includes('real') ? "#10b981" : "#ef4444";
                document.getElementById('confLabel').innerText = accuracy + "%";

                // Parse details
                document.getElementById('dataTable').style.display = "table";
                document.getElementById('d-amt').innerText = (raw.match(/[₹Rs]\s?\d+/) || ["--"])[0];
                document.getElementById('d-utr').innerText = (raw.match(/\d{10,12}/) || ["--"])[0];

                // Voice Output
                if(document.getElementById('voiceToggle').checked) {
                    const speech = new SpeechSynthesisUtterance(best.className + " Receipt Detected");
                    window.speechSynthesis.speak(speech);
                }
            } else {
                document.getElementById('resultHud').style.display = "none";
                document.getElementById('dataTable').style.display = "none";
            }
        });
    }
</script>
</body>
</html>
