<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AuthentiPay AI - Final Auditor</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
:root { --p: #0ea5e9; --d: #0f172a; --w: #ffffff; --r: #f43f5e; }
body { margin:0; font-family:'Inter', sans-serif; background: var(--d); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; color: #fff; overflow: hidden; }
.box { width:100%; max-width:400px; background:var(--w); border-radius:35px; padding:25px; color: #1e293b; box-shadow:0 30px 60px rgba(0,0,0,0.8); position: relative; }

/* LEFT TOP FAKE LOG */
#logBox { position: absolute; top: -15px; left: -10px; background: var(--r); color: #fff; padding: 12px; border-radius: 18px; font-size: 10px; font-weight: 800; text-align: left; box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4); z-index: 50; width: 130px; max-height: 160px; overflow-y: auto; border: 2px solid #fff; }

.viewport { position: relative; width: 100%; border-radius: 20px; overflow: hidden; background: #000; margin: 15px 0; border: 3px solid var(--p); max-height: 380px; display: none; }
#vid, #prev { width: 100%; height: auto; display: block; }
.line { position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: var(--p); box-shadow: 0 0 20px var(--p); animation: s 2s infinite linear; }
@keyframes s { 0% { top: 0%; } 100% { top: 100%; } }

.btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 1000; cursor: pointer; margin-top: 10px; font-size: 14px; text-transform: uppercase; transition: 0.2s; }
.b-m { background: var(--p); color: #fff; box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3); }
.b-a { background: #f1f5f9; color: var(--d); border: 2px solid #e2e8f0; }

.dash { background: #f8fafc; border-radius: 22px; padding: 18px; margin-top: 20px; border: 1px solid #e2e8f0; display: flex; justify-content: space-around; }
.stat { text-align: center; }
.val { font-size: 24px; font-weight: 1000; color: var(--d); }
.lbl { font-size: 9px; color: #64748b; font-weight: 900; letter-spacing: 1px; }

#over { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); display: none; place-items: center; z-index: 100; backdrop-filter: blur(15px); }
.mod { background: #fff; padding: 35px; border-radius: 35px; width: 80%; text-align: center; color: #1e293b; border: 4px solid var(--p); }
</style>
</head>
<body>

<div id="logBox">🚨 FAKE DETECTED:<br><div id="logList" style="margin-top:5px; opacity:0.9;">No logs yet</div></div>

<div class="box">
  <h2 style="margin:0; font-weight: 1000; font-size: 28px; color: #000; letter-spacing: -1px;">AuthentiPay <span style="color:var(--p)">AI</span></h2>
  <p style="font-size: 10px; color: #94a3b8; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px;">ULTIMATE AUDITOR v4.0</p>

  <div id="ui">
    <button class="btn b-m" onclick="startCam()">START SCANNER</button>
    <button class="btn b-a" onclick="document.getElementById('fileIn').click()">UPLOAD FROM GALLERY</button>
  </div>
  <input type="file" id="fileIn" hidden accept="image/*">

  <div id="vBox" class="viewport">
    <div class="line"></div>
    <video id="vid" autoplay playsinline></video>
    <img id="prev" style="display:none">
  </div>
  <button id="snap" class="btn b-m" style="display:none" onclick="capture()">VERIFY RECEIPT</button>

  <div class="dash">
    <div class="stat"><div class="val" id="totalDisp">₹0</div><div class="lbl">TOTAL REVENUE</div></div>
    <div class="stat"><div class="val" id="fakeDisp" style="color:var(--r)">0</div><div class="lbl">FAKES BLOCKED</div></div>
  </div>
</div>

<div id="over">
  <div class="mod">
    <div id="ico" style="font-size: 80px;"></div>
    <h2 id="tit" style="margin: 10px 0; font-weight: 1000;"></h2>
    <p id="txt" style="color: #64748b; font-size: 14px; font-weight: 700; margin-bottom: 25px;"></p>
    <button class="btn b-m" onclick="location.reload()">NEXT SCAN</button>
  </div>
</div>

<canvas id="can" hidden></canvas>

<script>
let db = JSON.parse(localStorage.getItem('ap_ultra_v4')) || { revenue: 0, fakeCount: 0, fakes: [], usedIDs: {} };
let stream = null;

function sync() {
    totalDisp.innerText = `₹${db.revenue.toLocaleString('en-IN')}`;
    fakeDisp.innerText = db.fakeCount;
    if(db.fakes.length > 0) {
        logList.innerHTML = db.fakes.slice(-6).reverse().map(f => `• ${f}`).join('<br>');
    }
}
sync();

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
    vid.srcObject = stream;
    vBox.style.display = "block"; ui.style.display = "none"; snap.style.display = "block";
  } catch(e) { alert("Camera Error"); }
}

function capture() {
  const ctx = can.getContext('2d');
  can.width = vid.videoWidth; can.height = vid.videoHeight;
  ctx.filter = "contrast(1.6) brightness(1.1) grayscale(1)";
  ctx.drawImage(vid, 0, 0);
  const data = can.toDataURL('image/jpeg', 0.9);
  vid.style.display = "none"; prev.src = data; prev.style.display = "block"; snap.style.display = "none";
  if(stream) stream.getTracks().forEach(t => t.stop());
  process(data);
}

fileIn.onchange = (e) => {
  const r = new FileReader();
  r.onload = (f) => {
    vBox.style.display = "block"; prev.src = f.target.result; prev.style.display = "block"; ui.style.display = "none";
    process(f.target.result);
  };
  r.readAsDataURL(e.target.files[0]);
};

async function process(img) {
  const { data: { text } } = await Tesseract.recognize(img, 'eng');
  analyze(text);
}

function analyze(raw) {
  const r = raw.toLowerCase();
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  // 1. ADVANCED AMOUNT DETECTION (Handles ₹5,500 style)
  const amtMatch = raw.match(/₹?\s?([\d,]+\.\d{2})/) || raw.match(/₹\s?([\d,]+)/);
  let amt = amtMatch ? parseFloat(amtMatch[1].replace(/,/g, '')) : 0;

  // 2. TRANSACTION ID DETECTION (UTR/Ref/Txn)
  const tidMatch = raw.match(/[T|t]\d{15,25}/) || raw.match(/\d{12}/) || raw.match(/UTR[:\s]+(\d+)/i);
  const tid = tidMatch ? (tidMatch[1] || tidMatch[0]) : null;

  // 3. STATUS & TRUST MARKERS
  const isOk = r.includes('success') || r.includes('successful') || r.includes('paid') || r.includes('credited');
  const hasBank = r.includes('bank') || r.includes('credited to') || r.includes('utr');

  // DUPLICATE CHECK LOGIC
  if(tid && db.usedIDs[tid]) {
      showModal("⚠️", "DUPLICATE", `This was already scanned at ${db.usedIDs[tid]}. Don't get scammed!`);
      talk("Warning! Duplicate receipt detected.");
      return;
  }

  // FINAL VERIFICATION
  if(amt > 0 && isOk && (tid || hasBank)) {
      db.revenue += amt;
      if(tid) db.usedIDs[tid] = time;
      save();
      showModal("✅", "REAL PAYMENT", `Verified ₹${amt}. Marker: ${tid || 'Bank Confirmed'}`);
      talk("Payment verified.");
  } else {
      db.fakeCount++;
      db.fakes.push(`${time}: ₹${amt || '??'}`);
      save();
      showModal("❌", "FAKE / INVALID", "Missing security markers or UTR. This receipt is not verified.");
      talk("Fake receipt alert.");
  }
}

function save() { localStorage.setItem('ap_ultra_v4', JSON.stringify(db)); sync(); }

function showModal(i, t, x) {
  over.style.display = "grid"; ico.innerText = i; tit.innerText = t; txt.innerText = x;
}

function talk(t) {
  const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; window.speechSynthesis.speak(u);
}
</script>
</body>
</html>
