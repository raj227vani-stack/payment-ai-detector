<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafePay AI Ultra-Fast</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f172a; color: white; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1e293b; padding: 25px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .camera-box { width: 100%; height: 350px; background: #000; border-radius: 20px; overflow: hidden; position: relative; border: 2px solid #38bdf8; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid rgba(56, 189, 248, 0.3); pointer-events: none; }
        .scan-bar { position: absolute; width: 100%; height: 4px; background: #38bdf8; box-shadow: 0 0 20px #38bdf8; animation: move 2.5s infinite linear; }
        @keyframes move { 0% { top: 0; } 100% { top: 100%; } }
        .btn { background: #38bdf8; color: #0f172a; border: none; padding: 18px; border-radius: 15px; width: 100%; font-weight: 800; font-size: 16px; margin-top: 15px; cursor: pointer; text-transform: uppercase; }
        #status { margin-top: 15px; font-size: 13px; color: #94a3b8; min-height: 20px; }
        #result { margin-top: 20px; padding: 20px; border-radius: 15px; font-weight: bold; display: none; font-size: 18px; animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(0.9); } 100% { transform: scale(1); } }
        .real { background: #065f46; color: #34d399; border: 1px solid #34d399; }
        .fake { background: #7f1d1d; color: #f87171; border: 1px solid #f87171; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:#38bdf8; margin-top:0;">SafePay AI Engine</h2>
    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
        <div class="scanner-overlay"><div class="scan-bar"></div></div>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <button id="mainBtn" class="btn" onclick="toggleScanner()">Start AI Scanner</button>
    <div id="status">System Offline</div>
    <div id="result"></div>
</div>

<script>
    let isScanning = false;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const resultDiv = document.getElementById('result');
    const statusText = document.getElementById('status');
    const btn = document.getElementById('mainBtn');

    function speak(t) { window.speechSynthesis.cancel(); window.speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }

    async function toggleScanner() {
        if (!isScanning) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            isScanning = true;
            btn.innerText = "Scanning... (Hold Still)";
            btn.style.background = "#64748b";
            statusText.innerText = "Searching for Transaction Data...";
            startAutoScan();
        }
    }

    async function startAutoScan() {
        if (!isScanning) return;

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const img = canvas.toDataURL('image/png');
        
        Tesseract.recognize(img, 'eng').then(({ data: { text } }) => {
            const val = text.toLowerCase();
            console.log("Reading:", val);

            // High Precision Keywords
            const keywords = ['utr', 'trans', 'success', 'paid', 'debited', 'upi ref', 'receiver', 'bank', 'tid:'];
            const foundCount = keywords.filter(word => val.includes(word)).length;

            if (foundCount >= 2) { // Exact match if 2 or more keywords found
                showResult(true);
            } else if (val.length > 50) { // If text is there but keywords missing
                setTimeout(startAutoScan, 500); // Try again
            } else {
                setTimeout(startAutoScan, 1000); // Keep looking
            }
        }).catch(() => setTimeout(startAutoScan, 1000));
    }

    function showResult(isReal) {
        isScanning = false;
        resultDiv.style.display = 'block';
        if (isReal) {
            resultDiv.innerHTML = "✅ TRANSACTION VERIFIED<br><span style='font-size:12px;'>Data Integrity: 100%</span>";
            resultDiv.className = "real";
            speak("Verified. Real Payment.");
        } else {
            resultDiv.innerHTML = "⚠️ BREACH DETECTED<br><span style='font-size:12px;'>Reason: Invalid Metadata</span>";
            resultDiv.className = "fake";
            speak("Warning. Fake Payment.");
        }
        btn.innerText = "Restart Scanner";
        btn.style.background = "#38bdf8";
        statusText.innerText = "Scan Complete.";
    }
</script>
</body>
</html>
