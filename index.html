<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Fake Payment Screenshot Detector</title>

<style>
body {
    background: #0f172a;
    color: white;
    text-align: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: #1e293b;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h1 { font-size: 26px; }

p {
    color: #94a3b8;
    margin-bottom: 20px;
}

button {
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    font-weight: bold;
}

button:hover { background: #16a34a; }
button:disabled { background: #64748b; cursor: not-allowed; }

input[type="file"] {
    margin: 20px 0;
    display: block;
    width: 100%;
    color: #94a3b8;
}

#preview {
    margin-top: 20px;
    border-radius: 10px;
    display: none;
    max-width: 100%;
    border: 2px solid #334155;
}

#result {
    margin-top: 25px;
    padding: 15px;
    border-radius: 8px;
    font-size: 20px;
    font-weight: bold;
    background: #0f172a;
}

.real { color: #4ade80; border: 1px solid #4ade80; }
.fake { color: #f87171; border: 1px solid #f87171; }
.loading { color: #fbbf24; }

.footer {
    margin-top: 30px;
    font-size: 12px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">
    <h1>💸 AI Fake Payment Screenshot Detector</h1>

    <p>Upload any payment screenshot and our AI will detect whether it is real or fake.</p>

    <button id="startBtn" onclick="startAI()">Load AI Model</button>

    <input type="file" id="imageUpload" accept="image/*">

    <img id="preview" width="300"/>

    <div id="result">Status: Waiting for AI...</div>

    <div class="footer">
        Developed by: Raj Vani, Ashutosh Shukla, Rachita Prasad, Krisha, Vanshika Jethwani <br>
        Karnavati University, Uvarsad Gandhinagar
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>

<script>
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/i583iDC7K/";

let model;
const resultDiv = document.getElementById("result");
const previewImg = document.getElementById("preview");
const startBtn = document.getElementById("startBtn");

async function startAI() {
    try {
        resultDiv.innerText = "Loading Model...";
        resultDiv.className = "loading";

        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

        resultDiv.innerText = "AI Ready ✅ Upload image";
        resultDiv.className = "";
        startBtn.disabled = true;
        startBtn.innerText = "Model Loaded";
    } catch (e) {
        resultDiv.innerText = "Error loading model";
        console.error(e);
    }
}

document.getElementById("imageUpload").addEventListener("change", async function(event) {
    if (!model) {
        alert("Please load AI model first!");
        return;
    }

    const file = event.target.files[0];
    if (!file) return;

    previewImg.src = URL.createObjectURL(file);
    previewImg.style.display = "block";

    resultDiv.innerText = "Analyzing...";
    resultDiv.className = "loading";

    previewImg.onload = async function () {
        const predictions = await model.predict(previewImg);
        predictions.sort((a, b) => b.probability - a.probability);

        const top = predictions[0];
        const confidence = (top.probability * 100).toFixed(1);

        if (top.className.toLowerCase().includes("real")) {
            resultDiv.innerText = "✅ REAL PAYMENT (" + confidence + "%)";
            resultDiv.className = "real";
        } else {
            resultDiv.innerText = "⚠️ FAKE PAYMENT (" + confidence + "%)";
            resultDiv.className = "fake";
        }
    };
});
</script>

</body>
</html>
