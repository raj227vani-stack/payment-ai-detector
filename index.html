<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuthentiPay AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js"></script>

<style>
body{
    margin:0;
    font-family:system-ui;
    background:#f1f5f9;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:420px;
    background:white;
    padding:20px;
    border-radius:20px;
    text-align:center;
}

.camera{
    height:260px;
    background:black;
    border-radius:15px;
    overflow:hidden;
    position:relative;
}

video{width:100%;height:100%;object-fit:cover;}

.box{
    position:absolute;
    border:2px dashed lime;
    width:80%;
    height:60%;
    top:20%;
    left:10%;
}

.result{
    margin-top:10px;
    padding:10px;
    border-radius:10px;
}

.real{background:#dcfce7;color:#166534;}
.fake{background:#fee2e2;color:#991b1b;}

.history{
    margin-top:15px;
    text-align:left;
    max-height:120px;
    overflow:auto;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">
<h2>AuthentiPay AI</h2>

<div class="camera">
<video id="video" autoplay></video>
<div class="box"></div>
</div>

<div id="result" class="result"></div>

<div class="history" id="history"></div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let model;
let video = document.getElementById('video');
let canvas = document.getElementById('canvas');
let resultDiv = document.getElementById('result');
let historyDiv = document.getElementById('history');

let buffer=[];

async function init(){
    model = await mobilenet.load();
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    video.srcObject = stream;
    autoScan();
    loadHistory();
}
init();

async function autoScan(){

    setInterval(async ()=>{

        if(video.readyState !== 4) return;

        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0);

        const predictions = await model.classify(canvas);
        let aiProb = predictions[0].probability;

        const { data: { text } } = await Tesseract.recognize(canvas,'eng');

        let patternScore=0;
        if(text.includes("@")) patternScore++;
        if(/\d{12}/.test(text)) patternScore++;
        if(text.toLowerCase().includes("paid")) patternScore++;

        let finalProb = (aiProb*0.7)+(patternScore*0.1);

        buffer.push(finalProb);
        if(buffer.length>5) buffer.shift();

        let avg = buffer.reduce((a,b)=>a+b,0)/buffer.length;

        showResult(avg,text);

    },2000);
}

function showResult(prob,text){

    let confidence = Math.round(prob*100);
    let risk = prob>0.7?"LOW":prob>0.5?"MEDIUM":"HIGH";

    let reason = prob>0.6 ?
    "Valid transaction patterns detected"
    :
    "Missing or inconsistent payment details";

    let extracted = extractData(text);

    if(prob>0.6){
        resultDiv.className="result real";
        resultDiv.innerHTML = `
        🟢 VERIFIED<br>
        Trust Score: ${confidence}/100<br>
        Risk: ${risk}<br><br>
        ${reason}<br><br>
        ${extracted}
        `;
    } else {
        resultDiv.className="result fake";
        resultDiv.innerHTML = `
        🔴 FAKE DETECTED<br>
        Trust Score: ${confidence}/100<br>
        Risk: ${risk}<br><br>
        ${reason}<br><br>
        ${extracted}
        `;
        saveRecord(text);
    }
}

function extractData(text){
    let amount = text.match(/₹\d+/);
    let upi = text.match(/\w+@\w+/);

    return `
    Amount: ${amount?amount[0]:"N/A"}<br>
    UPI: ${upi?upi[0]:"N/A"}
    `;
}

function saveRecord(text){
    let upi = (text.match(/\w+@\w+/)||["unknown"])[0];
    let time = new Date().toLocaleTimeString();

    let record = `Fake detected → ${upi} at ${time}`;

    let data = JSON.parse(localStorage.getItem("records")||"[]");
    data.push(record);
    localStorage.setItem("records",JSON.stringify(data));

    loadHistory();
}

function loadHistory(){
    let data = JSON.parse(localStorage.getItem("records")||"[]");
    historyDiv.innerHTML = "<b>Fraud Records:</b><br>"+data.slice(-5).join("<br>");
}
</script>

</body>
</html>
