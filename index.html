<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AuthentiPay AI</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(135deg,#0f172a,#f1f5f9);
  color:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container{
  width:420px;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
}
h2{text-align:center;margin:0;}
video{width:100%;border-radius:12px;margin-top:10px;}
.result{margin-top:12px;padding:12px;border-radius:12px;font-weight:bold;}
.real{background:#dcfce7;color:#166534;}
.fake{background:#fee2e2;color:#991b1b;}
.status{font-size:13px;color:#64748b;margin-top:6px;}
select{margin-top:8px;width:100%;padding:6px;}
</style>
</head>

<body>

<div class="container">
<h2>AuthentiPay AI</h2>

<select id="lang">
<option value="en">English</option>
<option value="hi">Hindi</option>
</select>

<video id="video" autoplay playsinline></video>

<div class="status" id="status">Initializing...</div>
<div id="result" class="result">Waiting...</div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
let video=document.getElementById('video');
let canvas=document.getElementById('canvas');
let resultDiv=document.getElementById('result');
let statusText=document.getElementById('status');
let lang=document.getElementById('lang');

let buffer=[];

async function init(){
  const stream=await navigator.mediaDevices.getUserMedia({video:true});
  video.srcObject=stream;
  loop();
}
init();

function loop(){
  setInterval(scan,1500); // fast + stable
}

async function scan(){

  if(video.readyState!==4) return;

  statusText.innerText="Analyzing...";

  const ctx=canvas.getContext('2d');

  // 🔥 ROI crop (center area only → faster OCR)
  let w=video.videoWidth;
  let h=video.videoHeight;
  canvas.width=w*0.6;
  canvas.height=h*0.6;

  ctx.drawImage(video,
    w*0.2,h*0.2,w*0.6,h*0.6,
    0,0,canvas.width,canvas.height
  );

  const { data:{ text } } = await Tesseract.recognize(canvas,'eng',{
    logger: m=>{}
  });

  let prob=analyze(text);

  buffer.push(prob);
  if(buffer.length>3) buffer.shift();

  let final=buffer.reduce((a,b)=>a+b,0)/buffer.length;

  showResult(final,text);
}

function analyze(text){

  text=text.toLowerCase();

  let score=0;

  // strong signals
  if(text.includes("@")) score+=2;
  if(/₹\s?\d+/.test(text)) score+=2;
  if(/\d{10,}/.test(text)) score+=2;
  if(text.includes("paid")||text.includes("success")) score+=2;

  // app detection boost
  if(text.includes("phonepe")||text.includes("gpay")||text.includes("paytm")||text.includes("bhim")) score+=1;

  return score/10;
}

function detectApp(text){
  text=text.toLowerCase();
  if(text.includes("phonepe")) return "PhonePe";
  if(text.includes("gpay")||text.includes("google pay")) return "GPay";
  if(text.includes("paytm")) return "Paytm";
  if(text.includes("bhim")) return "BHIM";
  return "Unknown";
}

function showResult(prob,text){

  let confidence=Math.round(prob*100);
  let app=detectApp(text);

  let upi=text.match(/\w+@\w+/);
  let amount=text.match(/₹\s?\d+/);

  let isReal = prob>0.5;

  let msg_en = isReal ? "Payment Verified" : "Suspicious Payment";
  let msg_hi = isReal ? "भुगतान सफल" : "संदिग्ध भुगतान";

  resultDiv.className="result "+(isReal?"real":"fake");

  resultDiv.innerHTML=`
  ${lang.value==="hi"?msg_hi:msg_en}<br>
  Trust Score: ${confidence}%<br>
  App: ${app}<br>
  Amount: ${amount?amount[0]:"N/A"}<br>
  UPI: ${upi?upi[0]:"N/A"}
  `;

  speak(isReal,confidence);
  statusText.innerText="Live Scan Active";
}

function speak(isReal,conf){
  let text = lang.value==="hi"
    ? (isReal?`भुगतान सही है ${conf} प्रतिशत भरोसा`:`यह नकली हो सकता है ${conf} प्रतिशत`)
    : (isReal?`Payment verified with ${conf} percent confidence`:`This may be fake with ${conf} percent`);

  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(text));
}
</script>

</body>
</html>
