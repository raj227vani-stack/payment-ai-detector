<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#1e3a8a,#2563eb);
    color: white;
}

header {
    text-align: center;
    padding: 15px;
    font-size: 24px;
    font-weight: bold;
}

.container {
    display: flex;
    height: 90vh;
}

.left, .right {
    width: 50%;
    padding: 20px;
}

.left {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

button {
    margin: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.upload-btn { background: white; color: #1e3a8a; }
.camera-btn { background: #22c55e; color: white; }
.scan-btn { background: #f59e0b; color: white; }

img, video {
    max-width: 300px;
    margin-top: 15px;
    border-radius: 10px;
}

.right {
    background: white;
    color: black;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #f1f5f9;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>🚀 AI Scanner</header>

<div class="container">

<div class="left">

<input type="file" id="fileInput" accept="image/*">
<button class="upload-btn" onclick="document.getElementById('fileInput').click()">Upload Image</button>

<button class="camera-btn" onclick="startCamera()">Open Camera</button>

<video id="video" autoplay playsinline style="display:none;"></video>
<img id="preview" style="display:none;">

<button class="scan-btn" onclick="predict()">Scan</button>

</div>

<div class="right">
<h2>Result</h2>
<div id="result" class="result">No result yet</div>
</div>

</div>

<script>
const URL = "https://teachablemachine.withgoogle.com/models/i583iDC7K/";

let model;
let currentImage = null;

// LOAD MODEL
async function loadModel() {
    try {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        console.log("Model loaded");
    } catch (e) {
        alert("Model load error");
        console.error(e);
    }
}
loadModel();

// IMAGE UPLOAD
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const video = document.getElementById("video");

fileInput.addEventListener("change", function() {
    const file = fileInput.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);

    preview.src = url;
    preview.style.display = "block";

    video.style.display = "none";

    currentImage = preview;
});

// CAMERA START
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });

        video.srcObject = stream;
        video.style.display = "block";
        preview.style.display = "none";

        currentImage = video;
    } catch (err) {
        alert("Camera not working (Use HTTPS or allow permission)");
        console.error(err);
    }
}

// PREDICT FUNCTION
async function predict() {
    const resultBox = document.getElementById("result");

    if (!model) {
        resultBox.innerHTML = "Model still loading...";
        return;
    }

    if (!currentImage) {
        resultBox.innerHTML = "Please upload or capture image first";
        return;
    }

    resultBox.innerHTML = "Scanning...";

    try {
        const prediction = await model.predict(currentImage);

        let best = prediction[0];
        for (let i = 1; i < prediction.length; i++) {
            if (prediction[i].probability > best.probability) {
                best = prediction[i];
            }
        }

        resultBox.innerHTML = `
            <h3>${best.className}</h3>
            <p>${(best.probability * 100).toFixed(2)}% confidence</p>
        `;
    } catch (e) {
        resultBox.innerHTML = "Error during prediction";
        console.error(e);
    }
}
</script>

</body>
</html>
